const keys = {};
const justPressed = {};
document.addEventListener('keydown', e => {
  if (!keys[e.code]) justPressed[e.code] = true;
  keys[e.code] = true;
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))
    e.preventDefault();
});
document.addEventListener('keyup', e => { keys[e.code] = false; });

// Mobile D-pad touch (simple overlay buttons injected below canvas)
function setupTouch() {
  const pad = document.createElement('div');
  pad.style.cssText = `display:flex;flex-direction:column;align-items:center;
    margin-top:8px;gap:2px;user-select:none;`;
  const row = (btns) => {
    const r = document.createElement('div');
    r.style.cssText = 'display:flex;gap:2px;';
    btns.forEach(([label, code]) => {
      const b = document.createElement('button');
      b.textContent = label;
      b.style.cssText = `width:44px;height:44px;background:#222;color:#0f0;
        border:1px solid #444;border-radius:6px;font-size:18px;
        cursor:pointer;touch-action:none;`;
      b.addEventListener('pointerdown', e => { e.preventDefault(); keys[code]=true; justPressed[code]=true; });
      b.addEventListener('pointerup',   e => { e.preventDefault(); keys[code]=false; });
      r.appendChild(b);
    });
    pad.appendChild(r);
  };
  row([['↑','ArrowUp']]);
  row([['←','ArrowLeft'],['Z','KeyZ'],['→','ArrowRight']]);
  row([['↓','ArrowDown'],['X','KeyX'],['','']]);
  document.body.appendChild(pad);
}
if ('ontouchstart' in window) setupTouch();

// ============================================================
// DIALOGUE SYSTEM
// ============================================================
const dlg = {
  active: false,
  lines: [],
  idx: 0,
  charIdx: 0,
  charTimer: 0,
  choices: null,
  choiceIdx: 0,
  onDone: null,
  speaker: '',
  speakerCol: P.WHT,
};

function startDialogue(lines, onDone) {
  dlg.active = true;
  dlg.lines   = lines;
  dlg.idx     = 0;
  dlg.charIdx = 0;
  dlg.charTimer = 0;
  dlg.choices = null;
  dlg.onDone  = onDone || null;
  game.state  = 'DIALOGUE';
  if (lines[0] && lines[0].speaker) {
    dlg.speaker    = lines[0].speaker;
    dlg.speakerCol = lines[0].col || P.WHT;
  }
}

function jumpTo(label) {
  const idx = dlg.lines.findIndex(l => l.label === label);
  if (idx !== -1) {
    dlg.idx     = idx;
    dlg.charIdx = 0;
    dlg.choices = null;
    dlg.choiceIdx = 0;
    updateSpeaker();
    // If the destination is itself a jump line, follow it immediately
    const dest = dlg.lines[idx];
    if (dest && dest.jump) jumpTo(dest.jump);
  }
}

function advanceDialogue() {
  const cur = dlg.lines[dlg.idx];

  // If still typing, jump to end of text
  if (cur && !cur.choices && !cur.jump && dlg.charIdx < (cur.text || '').length) {
    dlg.charIdx = (cur.text || '').length;
    return;
  }

  // Inline jump line (no text, just redirect)
  if (cur && cur.jump) {
    jumpTo(cur.jump);
    return;
  }

  // Choice line — confirm selection
  if (cur && cur.choices) {
    const chosen = cur.choices[dlg.choiceIdx];
    if (chosen.pick) game.choices[chosen.pick[0]] = chosen.pick[1];
    if (chosen.jump) { jumpTo(chosen.jump); return; }
  }

  dlg.idx++;

  // Auto-skip jump lines
  while (dlg.idx < dlg.lines.length && dlg.lines[dlg.idx] && dlg.lines[dlg.idx].jump) {
    jumpTo(dlg.lines[dlg.idx].jump);
    return;
  }

  if (dlg.idx >= dlg.lines.length) {
    dlg.active  = false;
    dlg.choices = null;
    game.state  = game.dockChaseActive ? 'DOCK_CHASE' : 'EXPLORE';
    if (dlg.onDone) dlg.onDone();
    return;
  }

  dlg.charIdx   = 0;
  dlg.charTimer = 0;
  dlg.choices   = null;
  dlg.choiceIdx = 0;
  updateSpeaker();
}

function updateSpeaker() {
  const cur = dlg.lines[dlg.idx];
  if (cur && cur.speaker !== undefined) {
    dlg.speaker    = cur.speaker;
    dlg.speakerCol = cur.col || P.WHT;
  }
}

function updateDialogue() {
  const cur = dlg.lines[dlg.idx];
  if (!cur) return;

  if (cur.choices) {
    dlg.choices = cur.choices;
    if (justPressed['ArrowUp'])   dlg.choiceIdx = Math.max(0, dlg.choiceIdx - 1);
    if (justPressed['ArrowDown'])  dlg.choiceIdx = Math.min(cur.choices.length - 1, dlg.choiceIdx + 1);
    if (justPressed['KeyZ'])       advanceDialogue();
    return;
  }

  dlg.choices = null;
  if (dlg.charIdx < (cur.text || '').length) {
    dlg.charTimer++;
    if (dlg.charTimer >= 2) {
      dlg.charTimer = 0;
      dlg.charIdx++;
    }
  }
  if (justPressed['KeyZ'] || justPressed['KeyX']) advanceDialogue();
}

// ============================================================
// DRAWING HELPERS
// ============================================================
function px(x, y, w, h, col) {
  ctx.fillStyle = col;
  ctx.fillRect(x, y, w, h);
}

function drawText(text, x, y, col, size) {
  ctx.fillStyle = col || P.WHT;
  ctx.font = `${size || 6}px monospace`;
  ctx.fillText(text, x, y);
}

function drawWrappedText(text, x, y, maxW, col, size) {
  const sz   = size || 6;
  const lineH = sz + 3;
  ctx.fillStyle = col || P.WHT;
  ctx.font = `${sz}px monospace`;
  const words = text.split(' ');
  let line = '';
  let cy   = y;
  for (const word of words) {
    const test = line ? line + ' ' + word : word;
    if (ctx.measureText(test).width > maxW && line) {
      ctx.fillText(line, x, cy);
      cy += lineH;
      line = word;
    } else {
      line = test;
    }
  }
  if (line) ctx.fillText(line, x, cy);
  return cy + lineH;
}

// 8-bit style dialog box
function drawDialogueBox() {
  if (!dlg.active) return;
  const cur = dlg.lines[dlg.idx];
  if (!cur) return;

  const bx = 4, by = GH - 66, bw = GW - 8, bh = 62;

  // Box bg + border
  px(bx,   by,   bw,   bh,   P.BLK);
  px(bx,   by,   bw,   2,    P.WHT);
  px(bx,   by+bh-2, bw, 2,  P.WHT);
  px(bx,   by,   2,    bh,   P.WHT);
  px(bx+bw-2, by, 2,   bh,   P.WHT);
  px(bx+2, by+2, bw-4, bh-4, '#0C0C1C');

  // Speaker name
  if (dlg.speaker) {
    px(bx+4, by-10, dlg.speaker.length * 6 + 8, 12, P.BLK);
    px(bx+4, by-10, dlg.speaker.length * 6 + 8, 2,  dlg.speakerCol);
    drawText(dlg.speaker, bx+8, by-2, dlg.speakerCol, 6);
  }

  if (cur.choices) {
    // Draw choices
    drawText('Choose:', bx+8, by+12, P.LGRY, 6);
    cur.choices.forEach((ch, i) => {
      const cy = by + 22 + i * 13;
      const sel = i === dlg.choiceIdx;
      if (sel) px(bx+8, cy-7, bw-16, 11, '#1C1C3C');
      drawText((sel ? '▶ ' : '  ') + ch.text, bx+12, cy, sel ? P.YEL : P.LGRY, 6);
    });
    return;
  }

  // Draw typed text
  const displayed = (cur.text || '').substring(0, dlg.charIdx);
  drawWrappedText(displayed, bx+8, by+14, bw-20, P.WHT, 6);

  // Blinking arrow if done
  if (dlg.charIdx >= (cur.text || '').length) {
    if (Math.floor(game.frame / 20) % 2 === 0)
      drawText('▼', bx+bw-12, by+bh-6, P.YEL, 6);
  }
}

function drawBeck(sx, sy, dir, fr) {
  if (pl.invincible > 0 && Math.floor(game.frame / 4) % 2) return;

  const HA = '#7B3F00', HB = '#C07030', HC = '#3A1E00';
  const SK = '#FFCC9A', EY = '#180800', EW = '#E8E0C8', MC = '#C87060';
  const HO = '#008888', HS = '#005555';
  const JN = '#2858C0', JD = '#162E70', SH = '#181008';

  function r(x,y,w,h,c) { ctx.fillStyle=c; ctx.fillRect(sx+x,sy+y,w,h); }

// ── NPC sprites (simpler but distinct) ──────────────────────
function drawNPCChar(sx, sy, npc, fr) {
  function r(x,y,w,h,c){ ctx.fillStyle=c; ctx.fillRect(sx+x,sy+y,w,h); }

  const id  = npc.id;
  const col = npc.col;

  // Hair / head colour per character
  const hairMap = {
    indy:     ['#C85820','#E87840'], // Indy — auburn short hair
    sterling: ['#1C1C1C','#383838'], // Sterling — dark/grey suit
    kane:     ['#808080','#A0A0A0'], // Kane — silver hair
    smuggler: ['#1C1C1C','#000000'], // Smuggler — dark
  };
  const [hA, hB] = hairMap[id] || ['#3C2400','#5C3800'];

  // Body/suit colour
  const bodyCol = (id==='indy') ? '#E84898' : (id==='sterling') ? '#2858A0'
                : (id==='kane')  ? '#505050'  : '#800000';

  // Hair
  r(3,0, 8,2, hA); r(2,1,10,2, hA);
  // Indy has slightly shorter hair (to ~row 14, not 22)
  const hairLen = (id==='indy') ? 13 : 6;
  r(0,2, 3, hairLen, hA); r(11,2, 3, hairLen, hA);
  r(1,3, 1, hairLen-2, hB); r(12,3, 1, hairLen-2, hB);

  // Face
  r(3,2, 8,9, P.SKN);
  r(3,2, 8,1, hA);        // hairline
  r(3,4, 3,1, hA);        // left brow
  r(8,4, 3,1, hA);        // right brow
  r(3,5, 3,2, '#F0F0E8'); // left eye (x=3-5)
  r(8,5, 3,2, '#F0F0E8'); // right eye (x=8-10) — 2px gap between
  r(4,6, 1,1, col);       // left iris
  r(9,6, 1,1, col);       // right iris
  r(5,9, 4,1, '#C08070'); // mouth

  // Neck
  r(5,11, 4,2, P.SKN);

  // Body
  r(3,13, 8,8, bodyCol);
  r(6,13, 2,8, '#00000030');  // seam

  // Arms
  const aO = fr ? 1 : 0;
  r(1,13-aO, 2,7, bodyCol);
  r(11,13+aO,2,7, bodyCol);

  // Legs
  const lO = fr ? 1 : 0;
  r(3,21, 8,4, '#1A3878');
  r(3,24, 3,4+lO,   '#1A3878');
  r(8,24, 3,4-lO+1, '#1A3878');

  // Shoes
  r(2,27+lO, 5,2, '#281808');
  r(7,28-lO, 5,2, '#281808');
}

// ============================================================
// MAP RENDERING
// ============================================================
function drawMap() {
  const map  = MAPS[game.mapId];
  const rows = map.rows;
  // Background
  ctx.fillStyle = map.bgCol;
  ctx.fillRect(0, 0, GW, GH);

  const startTX = Math.floor(cam.x / TW);
  const startTY = Math.floor(cam.y / TH);
  const endTX   = Math.min(map.w, startTX + Math.ceil(GW/TW) + 1);
  const endTY   = Math.min(map.h, startTY + Math.ceil(GH/TH) + 1);

  for (let ty = startTY; ty < endTY; ty++) {
    for (let tx = startTX; tx < endTX; tx++) {
      if (!rows[ty]) continue;
      const id  = rows[ty][tx];
      const def = T[id];
      if (!def) continue;
      const sx  = tx * TW - cam.x;
      const sy  = ty * TH - cam.y;

      ctx.fillStyle = def.c;
      ctx.fillRect(sx, sy, TW, TH);

      // Tile details
      if (id === 4) { // computer screen glow
        const g = Math.floor(game.frame/8)%2 ? '#20F8F8' : '#10D8E8';
        px(sx+2, sy+2, 12, 10, g);
        px(sx+4, sy+4, 8, 6, '#CCFFFF');
      } else if (id === 2) { // bed
        px(sx+1, sy+1, 14, 6, '#9060C0'); // pillow
        px(sx+1, sy+7, 14, 8, '#5030A0'); // sheet
      } else if (id === 12) { // exit zone
        const glowF = Math.floor(game.frame/15)%2;
        px(sx, sy, TW, TH, glowF ? '#30A840' : '#206830');
        drawText('EXIT', sx+1, sy+10, P.YEL, 5);
      } else if (id === 16) { // evidence crate
        px(sx+1, sy+1, 14, 14, '#2C4830');
        px(sx+3, sy+3, 10, 10, '#1C3820');
        if (Math.floor(game.frame/20)%2)
          px(sx+6, sy+6, 4, 4, P.AMB);
      } else if (id === 15) { // lockers
        for (let i=0;i<2;i++) {
          px(sx+1+i*8, sy+2, 6, TH-4, '#3C3028');
          px(sx+1+i*8, sy+TH/2, 6, 1, '#2C2018');
          px(sx+5+i*8, sy+4, 2, 2, '#787060');
        }
      } else if (id === 5) { // window (bedroom)
        px(sx+1, sy+1, 14, 14, '#3060A0');
        px(sx+7, sy+1, 2,  14, '#204070');
        px(sx+1, sy+7, 14, 2,  '#204070');
        // Stars
        if (game.frame%60<30) px(sx+3, sy+3, 1, 1, P.WHT);
        px(sx+11, sy+10, 1, 1, P.WHT);
      } else if (id === 11) { // fence
        px(sx+7, sy, 2, TH, '#555555');
        for (let fy=0;fy<TH;fy+=4) px(sx, sy+fy, TW, 1, '#444444');
      } else if (id === 19) { // cafeteria table
        px(sx+1, sy+3, 14, 10, '#604C30');
        px(sx+1, sy+3, 14, 2,  '#705838');
      } else if (id === 9) { // shipping crate — plank + cross brace
        px(sx+1, sy+1, 14, 14, '#6C4820');
        px(sx+3, sy+3, 10, 10, '#5C3818');
        px(sx+7, sy+1, 2,  14, '#4C3010');
        px(sx+1, sy+7, 14, 2,  '#4C3010');
        // Corner nails
        px(sx+2, sy+2, 2, 2, '#3C2408');
        px(sx+12,sy+2, 2, 2, '#3C2408');
      } else if (id === 8) { // dock floor — horizontal plank boards
        ctx.fillStyle = '#060E18';
        ctx.fillRect(sx, sy,   TW, 1);   // board seam top
        ctx.fillRect(sx, sy+8, TW, 1);   // board seam mid
        ctx.fillStyle = '#0A1828';
        ctx.fillRect(sx+4,  sy+3,  1, 1); // nail
        ctx.fillRect(sx+11, sy+11, 1, 1); // nail
      } else if (id === 17) { // dock shadow floor (inside sheds)
        ctx.fillStyle = '#0F0D16';
        ctx.fillRect(sx, sy,   TW, 1);
        ctx.fillRect(sx, sy+8, TW, 1);
      } else if (id === 10) { // metal container wall — rivets + edge shading
        ctx.fillStyle = '#607898';
        ctx.fillRect(sx, sy,       TW, 2); // highlight top edge
        ctx.fillStyle = '#283C50';
        ctx.fillRect(sx, sy+TH-2, TW, 2); // shadow bottom edge
        ctx.fillStyle = '#3A5870';         // rivets
        ctx.fillRect(sx+2,  sy+4,  2, 2);
        ctx.fillRect(sx+10, sy+4,  2, 2);
        ctx.fillRect(sx+2,  sy+10, 2, 2);
        ctx.fillRect(sx+10, sy+10, 2, 2);
      } else if (id === 20) { // dock border — bevelled edge
        ctx.fillStyle = '#201808';
        ctx.fillRect(sx+1, sy,       TW-2, 1); // top groove
        ctx.fillRect(sx,   sy,       1, TH);   // left groove
        ctx.fillRect(sx+TW-1, sy,    1, TH);   // right groove
        ctx.fillStyle = '#484020';
        ctx.fillRect(sx+2, sy+2, TW-4, 1);     // inner highlight
      } else if (id === 1) { // bedroom floor — tile grid
        ctx.fillStyle = '#2C2440';
        ctx.fillRect(sx, sy,   TW, 1);
        ctx.fillRect(sx, sy,   1,  TH);
      } else if (id === 13 || id === 18) { // school / cafe floor
        ctx.fillStyle = '#5A4C3A';
        ctx.fillRect(sx, sy,   TW, 1);
        ctx.fillRect(sx, sy,   1,  TH);
      }
    }
  }

  // Item indicators (only if not found)
  const map2 = MAPS[game.mapId];
  map2.items.forEach(item => {
    if (game.evidenceFound.includes(item.id)) return;
    if (item.id === 'computer') return; // always show computer
    const sx = item.tx * TW - cam.x;
    const sy = item.ty * TH - cam.y;
    if (Math.floor(game.frame/15)%2===0) {
      px(sx+4, sy-6, 8, 6, P.AMB);
      drawText('!', sx+6, sy-2, P.BLK, 5);
    }
  });
}

// ============================================================
// COLLISION
// ============================================================
function tileSolid(tx, ty) {
  const map  = MAPS[game.mapId];
  if (tx < 0 || ty < 0 || tx >= map.w || ty >= map.h) return true;
  const id   = map.rows[ty][tx];
  const def  = T[id];
  return def ? def.s : true;
}

function rectSolid(x, y, w, h) {
  const x2 = x + w - 1;
  const y2 = y + h - 1;
  return (
    tileSolid(Math.floor(x/TW),  Math.floor(y/TH))  ||
    tileSolid(Math.floor(x2/TW), Math.floor(y/TH))  ||
    tileSolid(Math.floor(x/TW),  Math.floor(y2/TH)) ||
    tileSolid(Math.floor(x2/TW), Math.floor(y2/TH))
  );
}

// ============================================================
// PLAYER MOVEMENT
// ============================================================
function updatePlayer() {
  if (game.state !== 'EXPLORE' && game.state !== 'DOCK_CHASE') return;

  let dx = 0, dy = 0;
  if (keys['ArrowLeft'] || keys['KeyA'])  dx = -pl.speed;
  if (keys['ArrowRight']|| keys['KeyD'])  dx =  pl.speed;
  if (keys['ArrowUp']   || keys['KeyW'])  dy = -pl.speed;
  if (keys['ArrowDown'] || keys['KeyS'])  dy =  pl.speed;

  if (dx && dy) { dx *= 0.707; dy *= 0.707; }

  pl.moving = dx !== 0 || dy !== 0;

  if (pl.moving) {
    if (Math.abs(dx) >= Math.abs(dy)) {
      pl.dir = dx > 0 ? 'right' : 'left';
    } else {
      pl.dir = dy > 0 ? 'down' : 'up';
    }
    pl.frameTimer++;
    if (pl.frameTimer >= 12) { pl.frameTimer = 0; pl.frame = 1 - pl.frame; }
  } else {
    pl.frame = 0;
  }

  const nx = pl.x + dx;
  const ny = pl.y + dy;
  const margin = 2;

  if (!rectSolid(nx + margin, pl.y + margin, pl.w - margin*2, pl.h - margin*2))
    pl.x = nx;
  if (!rectSolid(pl.x + margin, ny + margin, pl.w - margin*2, pl.h - margin*2))
    pl.y = ny;

  if (pl.invincible > 0) pl.invincible--;
}

// ============================================================
// INTERACTION CHECK
// ============================================================
function checkInteract() {
  if (!justPressed['KeyZ']) return;
  if (game.state !== 'EXPLORE') return;

  const cx = pl.x + pl.w/2;
  const cy = pl.y + pl.h/2;
  const map = MAPS[game.mapId];

  // Check items
  for (const item of map.items) {
    const ix = item.tx * TW + TW/2;
    const iy = item.ty * TH + TH/2;
    if (Math.abs(cx - ix) < TW * 1.5 && Math.abs(cy - iy) < TH * 1.5) {
      handleItem(item);
      return;
    }
  }

  // Check NPCs
  for (const npc of map.npcs) {
    if (!npc.active || npc.id === 'smuggler' || npc.id === 'cafe_arrow') continue;
    const nx = npc.x + 6;
    const ny = npc.y + 7;
    if (Math.abs(cx - nx) < TW * 2 && Math.abs(cy - ny) < TH * 2) {
      handleNPC(npc);
      return;
    }
  }
}

// ============================================================
// ITEM INTERACTIONS
// ============================================================
function handleItem(item) {
  if (item.id === 'computer') {
    startPuzzleMinigame();
    return;
  }

  if (item.id.startsWith('evidence_') && !game.evidenceFound.includes(item.id)) {
    const texts = {
      evidence_manifest: [
        {speaker:'', text:'You find a clipboard inside the guard booth.'},
        {speaker:'BECK', col:P.TEL, text:'Shipping manifest. "Agricultural equipment." Three signatures... one has a government seal.'},
        {speaker:'BECK', col:P.TEL, text:"That seal doesn't belong on a dock job. Something is very wrong here."},
      ],
      evidence_crates: [
        {speaker:'', text:'You lift the lid of an unmarked crate.'},
        {speaker:'BECK', col:P.TEL, text:'These weigh nothing like farm tools. She photographs everything.'},
        {speaker:'BECK', col:P.TEL, text:'Military-grade packaging foam. Whatever is inside is being protected from impact.'},
      ],
      evidence_photos: [
        {speaker:'', text:'Inside the storage shed: a folding table covered in photographs.'},
        {speaker:'BECK', col:P.TEL, text:'Rifles. Rocket components. Night-vision equipment. Serial numbers visible.'},
        {speaker:'BECK', col:P.TEL, text:'She photographs every single one. Her shutter sound has been off for months.'},
      ],
      evidence_plates: [
        {speaker:'', text:'Two vans. Plates covered by mud shields.'},
        {speaker:'BECK', col:P.TEL, text:'One shield slipped. Partial plate: 7-KX-4. Colorado commercial.'},
        {speaker:'BECK', col:P.TEL, text:'She gets the photo. Good enough.'},
      ],
    };

    game.evidenceFound.push(item.id);

    const lines = texts[item.id] || [{text:'You found something.'}];
    const allFound = ['evidence_manifest','evidence_crates','evidence_photos','evidence_plates']
      .every(id => game.evidenceFound.includes(id));

    startDialogue(allFound ? [
      ...lines,
      {speaker:'BECK', col:P.TEL, text:"That's everything. Four pieces of evidence. Time to get out."},
      {speaker:'', text:'The smugglers haven\'t spotted you yet. Reach the EXIT at the top of the dock.'},
      {speaker:'', text:'GET OUT NOW — reach the glowing EXIT at the top of the map!'},
    ] : lines, () => {
      if (allFound) triggerDockChase();
    });
    return;
  }

  if (item.id.startsWith('evidence_') && game.evidenceFound.includes(item.id)) {
    startDialogue([{speaker:'', text:'Already documented.'}]);
  }
}

function triggerDockChase() {
  game.dockChaseActive = true;
  const smuggler = MAPS['dock'].npcs[0];
  smuggler.active  = true;
  smuggler.x       = 15 * TW;
  smuggler.y       = 5  * TH;
  game.state       = 'DOCK_CHASE';
}

function updateDockChase() {
  if (!game.dockChaseActive) return;

  const map  = MAPS['dock'];
  const smug = map.npcs[0];
  if (!smug || !smug.active) return;

  // Move smuggler toward player
  const dx = (pl.x + pl.w/2) - (smug.x + 7);
  const dy = (pl.y + pl.h/2) - (smug.y + 7);
  const dist = Math.sqrt(dx*dx + dy*dy);

  if (dist > 4) {
    const nx = smug.x + (dx/dist) * smug.speed;
    const ny = smug.y + (dy/dist) * smug.speed;
    const m  = 2;
    if (!rectSolid(nx+m, smug.y+m, smug.w-m*2, smug.h-m*2)) smug.x = nx;
    if (!rectSolid(smug.x+m, ny+m, smug.w-m*2, smug.h-m*2)) smug.y = ny;
    smug.dir = Math.abs(dx) > Math.abs(dy) ? (dx>0?'right':'left') : (dy>0?'down':'up');
  }

  if (smug.cooldown > 0) { smug.cooldown--; return; }

  // Collision with player
  if (
    Math.abs((pl.x+pl.w/2) - (smug.x+7)) < 12 &&
    Math.abs((pl.y+pl.h/2) - (smug.y+7)) < 12 &&
    pl.invincible === 0
  ) {
    pl.hearts--;
    pl.invincible = 80;
    smug.cooldown = 60;
    showDamageFlash();
    if (pl.hearts <= 0) {
      startDialogue([
        {speaker:'', text:'CAUGHT! The smuggler grabbed you.'},
        {speaker:'', text:'Evidence still secured. You manage to break free and run.'},
        {speaker:'', text:'Try again — reach the EXIT at the top of the dock!'},
      ], () => {
        pl.hearts    = 3;
        pl.x         = MAPS['dock'].playerSpawn.x;
        pl.y         = MAPS['dock'].playerSpawn.y;
        smug.x       = 15*TW;
        smug.y       = 5*TH;
        smug.cooldown= 0;
        pl.invincible= 120;
        game.state   = 'DOCK_CHASE';
      });
    }
    return;
  }

  // Player reached exit
  const exitTX = 8, exitTY = 0;
  const exitX  = exitTX * TW;
  const exitY  = exitTY * TH;
  if (pl.x + pl.w > exitX && pl.x < exitX + TW && pl.y < exitY + TH*2) {
    game.dockChaseActive  = false;
    smug.active           = false;
    startDialogue([
      {speaker:'', text:'You hit the street at full speed.'},
      {speaker:'BECK', col:P.TEL, text:'All 43 photos intact.'},
      {speaker:'', text:'You send the evidence to the police, the FBI, and three journalists.'},
      {speaker:'', text:'Four days later: FEDERAL RAID ON EAST DOCK — $4.2M IN WEAPONS SEIZED.'},
      {speaker:'', text:'Nobody knows it was you.'},
      {speaker:'', text:'Two weeks pass. Then something strange happens at school...'},
    ], () => loadScene('school'));
    return;
  }

  updatePlayer(); // allow player movement during chase
}

function drawHUD() {
  if (['TITLE','ENDING','INTRO','CHAPTER_CARD'].includes(game.state)) return;

  // Hearts
  for (let i = 0; i < pl.maxHearts; i++) {
    const hx = 4 + i * 10;
    const hy = 4;
    px(hx, hy, 8, 7, i < pl.hearts ? P.RED : P.DGRY);
    px(hx+2, hy-1, 2, 1, i < pl.hearts ? P.LRED : '#404040');
    px(hx+5, hy-1, 2, 1, i < pl.hearts ? P.LRED : '#404040');
  }

  // Evidence count (only on dock)
  if (game.mapId === 'dock') {
    const ev = game.evidenceFound.length;
    drawText(`EV:${ev}/4`, GW-36, 11, ev >= 4 ? P.YEL : P.LGRY, 6);
  }

  // Scene name flash
  if (game.frame < 160) {
    const map   = MAPS[game.mapId];
    const label = map.name;
    const tw2   = label.length * 6;
    const bx    = Math.floor(GW/2 - tw2/2 - 4);
    px(bx, GH/2 - 10, tw2+8, 14, P.BLK);
    px(bx, GH/2 - 10, tw2+8, 2,  P.YEL);
    drawText(label, bx+4, GH/2+1, P.YEL, 6);
  }

  // Damage flash overlay
  if (damageFlash > 0) {
    ctx.fillStyle = `rgba(220,0,0,${damageFlash/15 * 0.4})`;
    ctx.fillRect(0, 0, GW, GH);
    damageFlash--;
  }

  // Interaction prompt
  if (game.state === 'EXPLORE') drawInteractPrompt();
}

function drawInteractPrompt() {
  const cx  = pl.x + pl.w/2;
  const cy  = pl.y + pl.h/2;
  const map = MAPS[game.mapId];

  for (const item of map.items) {
    const ix = item.tx * TW + TW/2;
    const iy = item.ty * TH + TH/2;
    if (Math.abs(cx-ix) < TW*1.5 && Math.abs(cy-iy) < TH*1.5) {
      const sx = item.tx * TW - cam.x;
      const sy = item.ty * TH - cam.y;
      const label = item.label;
      px(sx-2, sy-14, label.length*5+8, 11, P.BLK);
      drawText(label, sx, sy-7, P.YEL, 5);
      return;
    }
  }

  for (const npc of map.npcs) {
    if (!npc.active || npc.id === 'smuggler' || npc.id === 'cafe_arrow') continue;
    const nx = npc.x + 6;
    const ny = npc.y + 7;
    if (Math.abs(cx-nx) < TW*2 && Math.abs(cy-ny) < TH*2) {
      const sx  = npc.x - cam.x;
      const sy  = npc.y - cam.y;
      const label = '[Z] Talk';
      px(sx, sy-14, 36, 11, P.BLK);
      drawText(label, sx+2, sy-7, P.YEL, 5);
      return;
    }
  }
}

const ANOMALY_CLUES = [
  {word:'dock crane', note:'"dock" — names a place, not an object in the photo.'},
  {word:'east-facing (moon pos)', note:'Wrong. The moon does not indicate east. Deliberate error.'},
  {word:'late-night unusual op', note:'Describes what is HAPPENING, not what the photo shows.'},
  {word:'contraband indicators', note:'A caption describing crime? Not a photo caption — a message.'},
];

function startPuzzleMinigame() {
  puzzle.active       = true;
  puzzle.phase        = 0;
  puzzle.selected     = 0;
  puzzle.answered     = false;
  puzzle.cluesFound   = 0;
  puzzle.cluesSel     = 0;
  puzzle.flashTimer   = 0;
  game.state          = 'MINIGAME_PUZZLE';
}

function updatePuzzle() {
  if (!puzzle.active) return;

  if (justPressed['KeyZ']) {
    if (puzzle.phase < 2) {
      // Location puzzle
      if (!puzzle.answered) {
        puzzle.answered      = true;
        puzzle.answerCorrect = (puzzle.selected === PZ_DATA[puzzle.phase].correct);
        puzzle.flashTimer    = 80;
      } else {
        // Advance phase
        puzzle.phase++;
        puzzle.answered   = false;
        puzzle.selected   = 0;
        puzzle.flashTimer = 0;
        if (puzzle.phase === 2) puzzle.cluesSel = 0;
      }
    } else if (puzzle.phase === 2) {
      // Anomaly puzzle
      if (puzzle.cluesFound < ANOMALY_CLUES.length) {
        const idx = puzzle.cluesSel;
        if (idx < ANOMALY_CLUES.length) {
          puzzle.cluesFound = Math.max(puzzle.cluesFound, idx + 1);
          if (puzzle.cluesFound >= ANOMALY_CLUES.length) {
            puzzle.flashTimer = 100;
          }
        }
      } else {
        // Done — advance to dock
        puzzle.active = false;
        game.state    = 'EXPLORE';
        startDialogue([
          {speaker:'BECK', col:P.TEL, text:'The coordinates in that photo match the East Dock. 11 PM tonight.'},
          {speaker:'BECK', col:P.TEL, text:"Someone is using Pattern Lock to send instructions. It's a dead drop."},
          {choices:[
            {text:'Call the police first.',     pick:['first','police'],     jump:'police_call'},
            {text:'Go to the dock right now.',  pick:['first','dock_first'], jump:'go_dock'},
          ]},
          {label:'police_call',
           speaker:'DISPATCH', col:P.LGRY, text:'"Denver PD non-emergency."'},
          {speaker:'BECK', col:P.TEL, text:'There\'s an illegal weapons shipment at the East Dock tonight. I decoded hidden messages—'},
          {speaker:'DISPATCH', col:P.LGRY, text:'"How old are you, hon?"'},
          {speaker:'BECK', col:P.TEL, text:'That is NOT relevant—'},
          {speaker:'DISPATCH', col:P.LGRY, text:'"Is this for a school project?"'},
          {speaker:'', text:'They hang up.'},
          {speaker:'BECK', col:P.TEL, text:'Fine. I\'ll prove it myself.'},{jump:'go_dock'},
          {label:'go_dock',
           speaker:'', text:"Beck puts on dark clothes. Leaves a note: 'Went for a ride. Back by midnight.'"},
          {speaker:'', text:'The East Dock is 20 minutes by bike. It is 10:22 PM.'},
          {speaker:'', text:'She goes alone.'},
        ], () => loadScene('dock'));
      }
    }
  }

  if (puzzle.phase < 2 && !puzzle.answered) {
    if (justPressed['ArrowUp'])   puzzle.selected = Math.max(0, puzzle.selected-1);
    if (justPressed['ArrowDown'])  puzzle.selected = Math.min(3, puzzle.selected+1);
  } else if (puzzle.phase === 2 && puzzle.cluesFound < ANOMALY_CLUES.length) {
    if (justPressed['ArrowUp'])   puzzle.cluesSel = Math.max(0, puzzle.cluesSel-1);
    if (justPressed['ArrowDown'])  puzzle.cluesSel = Math.min(ANOMALY_CLUES.length-1, puzzle.cluesSel+1);
  }

  if (puzzle.flashTimer > 0) puzzle.flashTimer--;
}

function drawPuzzle() {
  if (!puzzle.active) return;

  // Dark overlay
  ctx.fillStyle = '#000000CC';
  ctx.fillRect(0, 0, GW, GH);

  // Screen frame — slightly larger than before for more room
  const bx=6, by=6, bw=GW-12, bh=GH-12;
  px(bx, by, bw, bh, '#08081C');
  px(bx, by, bw, 2, P.TEL);
  px(bx, by+bh-2, bw, 2, P.TEL);
  px(bx, by, 2, bh, P.TEL);
  px(bx+bw-2, by, 2, bh, P.TEL);

  // Header bar
  px(bx+2, by+2, bw-4, 15, '#0C1826');
  drawText('PATTERN LOCK', bx+8, by+13, P.TEL, 8);
  drawText('WEEK 47', bx+bw-58, by+13, P.YEL, 8);

  if (puzzle.phase < 2) {
    const pz = PZ_DATA[puzzle.phase];
    drawText(pz.heading, bx+8, by+27, '#8899AA', 7);

    // Photo box
    px(bx+6, by+31, bw-12, 68, '#040412');
    px(bx+6, by+31, bw-12, 1, '#334466');
    px(bx+6, by+98, bw-12, 1, '#334466');
    pz.photo.forEach((line, i) => {
      drawText(line, bx+10, by+44+i*12, '#C0D0E0', 7);
    });

    drawText('WHERE WAS THIS TAKEN?', bx+8, by+110, P.WHT, 8);

    pz.opts.forEach((opt, i) => {
      const oy  = by + 125 + i * 16;
      const sel = i === puzzle.selected;
      if (puzzle.answered) {
        const correct = i === pz.correct;
        px(bx+6, oy-9, bw-12, 13,
          correct ? '#003800' : (sel && !correct ? '#3A0000' : '#10101C'));
        drawText(opt, bx+22, oy, correct ? P.LGRN : (sel&&!correct ? P.LRED : '#777788'), 7);
        if (correct) drawText('✓', bx+12, oy, P.LGRN, 8);
      } else {
        if (sel) px(bx+6, oy-9, bw-12, 13, '#0C1C3C');
        drawText((sel ? '▶ ' : '  ') + opt, bx+12, oy, sel ? P.YEL : '#9999BB', 7);
      }
    });

    if (puzzle.answered) {
      const note = puzzle.answerCorrect
        ? 'CORRECT! ' + pz.explain
        : 'Beck already knows the answer.';
      drawWrappedText(note, bx+10, by+193, bw-20,
        puzzle.answerCorrect ? P.LGRN : P.YEL, 7);
      if (puzzle.flashTimer <= 0)
        drawText('[Z] NEXT', bx+bw-60, by+bh-10, P.YEL, 7);
    } else {
      drawText('[↑↓] SELECT   [Z] CONFIRM', bx+8, by+bh-10, '#668899', 7);
    }

  } else {
    // Anomaly puzzle
    drawText('PUZZLE #11 — SOMETHING IS WRONG', bx+8, by+27, P.YEL, 7);

    const photoLines = [
      'Container shipping yard at night.',
      'Dock crane visible at far right.',
      'Water east-facing (moon position).',
      'Late-night unusual operation.',
      'Possible contraband indicators.',
      'COORD: 39.73N 104.99W   TIME: 23:00',
    ];
    px(bx+6, by+31, bw-12, 78, '#040412');
    px(bx+6, by+31, bw-12, 1, '#334466');
    px(bx+6, by+108, bw-12, 1, '#334466');
    photoLines.forEach((l, i) => {
      const isClue  = i >= 1 && i <= 4;
      const clueIdx = i - 1;
      const found   = isClue && clueIdx < puzzle.cluesFound;
      const sel     = isClue && clueIdx === puzzle.cluesSel;
      let col = '#C0D0E0';
      if (isClue) {
        if (found)      col = P.LGRN;
        else if (sel)   col = P.YEL;
        else            col = P.AMB;
        if (!found && sel && Math.floor(game.frame/20)%2===0) col = '#FFFFFF';
      }
      drawText(l, bx+10, by+44+i*12, col, 7);
    });

    drawText('FIND THE 4 HIDDEN SIGNALS:', bx+8, by+120, P.WHT, 8);

    if (puzzle.cluesFound < ANOMALY_CLUES.length) {
      const note = ANOMALY_CLUES[puzzle.cluesSel];
      drawText('▶  ' + note.word, bx+10, by+136, P.YEL, 8);
      drawWrappedText(note.note, bx+10, by+150, bw-20, '#B0C0D0', 7);
      drawText('Signals found: ' + puzzle.cluesFound + ' / 4',
        bx+8, by+192, P.AMB, 7);
      drawText('[↑↓] PICK   [Z] MARK', bx+8, by+bh-10, '#668899', 7);
    } else {
      if (puzzle.flashTimer > 0) {
        px(bx+10, by+112, bw-20, 82, '#001400');
        drawText('ALL SIGNALS DECODED!', bx+22, by+136, P.LGRN, 8);
        drawText('EAST DOCK — 11 PM TONIGHT', bx+14, by+153, P.YEL, 8);
        drawText('ILLEGAL ARMS SHIPMENT', bx+22, by+169, P.RED, 8);
      }
      if (puzzle.flashTimer <= 0 || puzzle.flashTimer < 50)
        drawText('[Z] CONTINUE', bx+bw-84, by+bh-10, P.YEL, 7);
    }
  }
}

    ctx.fillText(slide.location, GW/2, y);
    y += 14;
    ctx.fillStyle = '#8899AA';
    ctx.font = '6px monospace';
    ctx.fillText('Present Day', GW/2, y);
    y += 16;
    px(22, y, GW-44, 1, '#333344');
    y += 12;
  }

  if (slide.highlight) {
    ctx.fillStyle = P.TEL;
    ctx.font = '7px monospace';
    ctx.fillText(slide.highlight, GW/2, y);
    y += 18;
    px(22, y-6, GW-44, 1, '#1A2A3A');
    y += 4;
  }

  slide.lines.forEach(line => {
    if (line === '') { y += 8; return; }
    const special = line.includes('PATTERN LOCK');
    ctx.fillStyle = special ? P.TEL : P.WHT;
    ctx.font = `${special ? 7 : 6}px monospace`;
    ctx.fillText(line, GW/2, y);
    y += special ? 14 : 12;
  });

  ctx.restore();

  // Progress dots at bottom
  const n = INTRO_SLIDES.length;
  for (let i = 0; i < n; i++) {
    px(GW/2 - n*4 + i*8, GH-16, 5, 3, i === intro.slide ? P.WHT : '#444');
  }

  // "Next" hint (blinks)
  if (Math.floor(game.frame/28)%2===0)
    drawText('[Z] NEXT', GW-58, GH-8, '#555566', 6);
}

function drawChapterCard() {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, GW, GH);

  const alpha = Math.min(1, intro.timer / 50);
  ctx.globalAlpha = alpha;

  px(0, GH/2-26, GW, 52, '#080818');
  px(0, GH/2-26, GW, 1, P.TEL);
  px(0, GH/2+26, GW, 1, P.TEL);

  ctx.save();
  ctx.textAlign = 'center';
  ctx.fillStyle = '#8899AA';
  ctx.font = '6px monospace';
  ctx.fillText('C H A P T E R   O N E', GW/2, GH/2-10);
  ctx.fillStyle = P.WHT;
  ctx.font = '9px monospace';
  ctx.fillText('The Pattern', GW/2, GH/2+9);
  ctx.restore();

  ctx.globalAlpha = 1;

  if (intro.timer > 140 && Math.floor(game.frame/28)%2===0) {
    ctx.save();
    ctx.textAlign = 'center';
    ctx.fillStyle = '#666';
    ctx.font = '6px monospace';
    ctx.fillText('[Z] BEGIN', GW/2, GH-12);
    ctx.restore();
  }
}

// ============================================================
// TITLE SCREEN
// ============================================================
function drawTitle() {
  ctx.fillStyle = '#000000';
  ctx.fillRect(0, 0, GW, GH);

  // Stars
  const stars = [[20,15],[80,8],[140,20],[200,12],[240,30],
                  [40,50],[160,45],[220,55],[100,60],[30,80]];
  stars.forEach(([sx,sy]) => {
    const b = (Math.floor(game.frame/30) + Math.floor(sx/40)) % 2;
    px(sx, sy, 1, 1, b ? P.WHT : P.GRY);
  });

  // Title box
  px(20, 60, GW-40, 70, '#08081C');
  px(20, 60, GW-40, 2, P.TEL);
  px(20, 130, GW-40, 2, P.TEL);
  px(20, 60, 2, 70, P.TEL);
  px(GW-22, 60, 2, 70, P.TEL);

  drawText('BECK  HAWTHORNE', 38, 82, P.WHT, 8);
  drawText('ORIGIN', 92, 98, P.TEL, 8);
  px(38, 104, GW-76, 1, P.TEL);
  drawText('PROJECT  ARGUS', 52, 116, P.YEL, 6);
  drawText('CHAPTER ONE:  PATTERN', 54, 126, P.GRY, 5);

  if (Math.floor(game.frame/25)%2===0)
    drawText('PRESS  Z  TO  START', 68, 160, P.WHT, 6);

  drawText('ARROW KEYS: MOVE     Z: INTERACT', 30, 185, P.DGRY, 5);
  drawText('X: SKIP     EXPLORE EVERYTHING', 34, 195, P.DGRY, 5);

  // NES copyright style
  drawText('© BECK HAWTHORNE: ORIGIN  2024', 30, 225, '#303030', 5);

  if (justPressed['KeyZ'] || justPressed['KeyX'] || justPressed['Space']) {
    intro.slide = 0; intro.timer = 0;
    game.state = 'INTRO';
  }
}

// ============================================================
// ENDING SCREEN
// ============================================================
function drawEnding() {
  ctx.fillStyle = '#000000';
  ctx.fillRect(0, 0, GW, GH);

  px(10, 10, GW-20, GH-20, '#080818');
  px(10, 10, GW-20, 2, P.YEL);
  px(10, GH-12, GW-20, 2, P.YEL);

  drawText('CHAPTER ONE COMPLETE', 36, 32, P.YEL, 6);
  px(20, 37, GW-40, 1, P.DGRY);

  const choice = game.choices['final'] || 'silent';
  const lines = {
    pushback:[
      '"One day blindly following',
      'orders gets someone killed."',
      '',
      "Kane doesn't answer.",
      'Beck picks up the card.',
    ],
    silent:[
      'Beck picks up the card.',
      'Says nothing.',
      '',
      'Sometimes silence is',
      'the loudest answer.',
    ],
    maybe:[
      '"I\'ll think about it."',
      '',
      'She calls three days later.',
      'At midnight.',
      'She tells herself it\'s',
      'just a phone call.',
    ],
  }[choice];

  lines.forEach((l, i) => {
    drawText(l, 30, 56 + i * 13, P.WHT, 6);
  });

  px(20, 145, GW-40, 1, P.DGRY);
  drawText('Three days later:', 30, 160, P.GRY, 5);
  drawText('She calls the number.', 30, 172, P.TEL, 6);
  drawText('Two days after that:', 30, 186, P.GRY, 5);
  drawText('Her grandfather says yes.', 30, 198, P.WHT, 6);

  px(20, 208, GW-40, 1, P.DGRY);
  if (Math.floor(game.frame/30)%2===0)
    drawText('CHAPTER TWO: TEAM — COMING SOON', 18, 226, P.YEL, 5);

  if (justPressed['KeyZ'])
    restartGame();
}

// ============================================================
// SCENE LOADING
// ============================================================
function loadScene(mapId) {
  game.mapId          = mapId;
  game.dockChaseActive = false;
  game.state          = 'EXPLORE';
  game.frame          = 0;

  const map = MAPS[mapId];
  pl.x     = map.playerSpawn.x;
  pl.y     = map.playerSpawn.y;
  pl.hearts = Math.min(pl.maxHearts, pl.hearts + 1); // restore 1 heart on scene change
  pl.invincible = 60;
  updateCam();
}

function restartGame() {
  Object.assign(game, {
    state:'TITLE', frame:0, mapId:'bedroom',
    evidenceFound:[], choices:{}, dockChaseActive:false,
  });
  intro.slide = 0; intro.timer = 0;
  Object.assign(pl, {x:0,y:0,dir:'down',frame:0,moving:false,hearts:3,invincible:0});
  // Reset dock npcs
  MAPS['dock'].npcs.forEach(n => { n.active=false; n.x=15*TW; n.y=5*TH; });
  game.frame = 0;
}

// puzzle box inner height constant
const hh = GH - 20;

// ============================================================
// MAIN GAME LOOP
// ============================================================
function loop() {
  game.frame++;

  // --- UPDATE ---
  switch (game.state) {
    case 'TITLE':
      break;
    case 'INTRO':
      updateIntro();
      break;
    case 'CHAPTER_CARD':
      updateChapterCard();
      break;
    case 'EXPLORE':
      updatePlayer();
      checkInteract();
      checkCafeArrow();
      updateCam();
      break;
    case 'DIALOGUE':
      updateDialogue();
      break;
    case 'MINIGAME_PUZZLE':
      updatePuzzle();
      break;
    case 'DOCK_CHASE':
      updatePlayer();
      updateDockChase();
      checkInteract();
      updateCam();
      break;
    case 'ENDING':
      break;
  }

  // --- DRAW ---
  ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0);
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, GW, GH);

  if (game.state === 'TITLE') {
    drawTitle();
  } else if (game.state === 'INTRO') {
    drawIntro();
  } else if (game.state === 'CHAPTER_CARD') {
    drawChapterCard();
  } else if (game.state === 'ENDING') {
    drawEnding();
  } else {
    drawMap();

    // Draw NPCs
    const map = MAPS[game.mapId];
    map.npcs.forEach(drawNPC);

    // Draw player
    drawPlayer();

    // Dialogue box
    drawDialogueBox();

    // Puzzle overlay
    if (game.state === 'MINIGAME_PUZZLE') drawPuzzle();

    drawHUD();
  }

  // Clear justPressed AFTER drawing so title/ending screens can read it
  for (const k in justPressed) delete justPressed[k];

  requestAnimationFrame(loop);
}

// ============================================================
// INIT
// ============================================================
restartGame();
game.state = 'TITLE';
requestAnimationFrame(loop);
</script>
