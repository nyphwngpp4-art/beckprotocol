// ============================================================
// AUDIO ENGINE — chiptune synth, WebAudio only, no audio files
// ============================================================
// One AudioContext, created lazily on first keydown (autoplay policy).
// sfx() = short envelope'd square/triangle/noise blips.
// music() = 2-channel sequencer (pulse lead + triangle bass) that
// schedules notes ahead of ctx.currentTime every frame (lookahead
// scheduling) so loops never gap or click. No setInterval.
const AU = {
  ctx: null,
  muted: false,
  masterGain: null,
  musicGain: null,
  sfxGain: null,
  musicName: null,
  leadState: { idx: 0, nextTime: null },
  bassState: { idx: 0, nextTime: null },

  ensure() {
    if (this.ctx) return;
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    this.ctx = new Ctx();
    this.masterGain = this.ctx.createGain();
    this.masterGain.gain.value = this.muted ? 0 : 1;
    this.masterGain.connect(this.ctx.destination);
    this.musicGain = this.ctx.createGain();
    this.musicGain.gain.value = 0.35;
    this.musicGain.connect(this.masterGain);
    this.sfxGain = this.ctx.createGain();
    this.sfxGain.gain.value = 0.5;
    this.sfxGain.connect(this.masterGain);
  },

  toggleMute() {
    this.muted = !this.muted;
    if (this.masterGain) this.masterGain.gain.value = this.muted ? 0 : 1;
    saveGame();
  },

  // Single envelope'd note. type: 'square' | 'triangle' | 'noise'.
  tone(freq, type, dur, peak, when, dest) {
    if (!this.ctx) return;
    const t0 = when != null ? when : this.ctx.currentTime;
    let src;
    if (type === 'noise') {
      const n = Math.max(1, Math.floor(this.ctx.sampleRate * dur));
      const buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < n; i++) data[i] = Math.random() * 2 - 1;
      src = this.ctx.createBufferSource();
      src.buffer = buf;
    } else {
      src = this.ctx.createOscillator();
      src.type = type;
      src.frequency.setValueAtTime(freq, t0);
    }
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(peak, t0 + 0.008);
    g.gain.linearRampToValueAtTime(0.0001, t0 + dur);
    src.connect(g);
    g.connect(dest || this.sfxGain);
    src.start(t0);
    src.stop(t0 + dur + 0.02);
  },

  sfx(name) {
    this.ensure();
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    switch (name) {
      case 'text':    this.tone(1200, 'square',  0.03, 0.15, t); break;
      case 'confirm': this.tone(660,  'square',  0.05, 0.25, t);
                       this.tone(880,  'square',  0.08, 0.25, t + 0.05); break;
      case 'cancel':  this.tone(440,  'square',  0.05, 0.2,  t);
                       this.tone(330,  'square',  0.08, 0.2,  t + 0.05); break;
      case 'pickup':  this.tone(523,  'square',  0.06, 0.25, t);
                       this.tone(784,  'square',  0.08, 0.25, t + 0.06);
                       this.tone(1047, 'square',  0.12, 0.25, t + 0.12); break;
      case 'hurt':    this.tone(160,  'noise',   0.15, 0.3,  t);
                       this.tone(110,  'square',  0.15, 0.2,  t); break;
      case 'alert':   this.tone(880,  'square',  0.09, 0.3,  t);
                       this.tone(880,  'square',  0.09, 0.3,  t + 0.15);
                       this.tone(880,  'square',  0.09, 0.3,  t + 0.3); break;
      case 'success': this.tone(523,  'triangle', 0.1, 0.3,  t);
                       this.tone(659,  'triangle', 0.1, 0.3,  t + 0.1);
                       this.tone(784,  'triangle', 0.1, 0.3,  t + 0.2);
                       this.tone(1047, 'triangle', 0.2, 0.3,  t + 0.3); break;
      case 'door':    this.tone(220,  'square',  0.08, 0.2,  t);
                       this.tone(150,  'square',  0.12, 0.2,  t + 0.08); break;
      case 'heart':   this.tone(784,  'triangle', 0.1, 0.25, t);
                       this.tone(1047, 'triangle', 0.14, 0.25, t + 0.08); break;
    }
  },

  music(name) {
    if (this.musicName === name) return;
    this.musicName  = name;
    this.leadState  = { idx: 0, nextTime: null };
    this.bassState  = { idx: 0, nextTime: null };
  },

  stopMusic() {
    this.musicName = null;
  },

  // Called every frame from loop(). Schedules notes on each channel
  // whenever they fall within a short lookahead window of ctx.currentTime.
  updateMusic() {
    if (!this.ctx || !this.musicName) return;
    const score = MUSIC[this.musicName];
    if (!score) return;
    const spu = 60 / score.bpm / 4; // seconds per sixteenth unit
    if (this.leadState.nextTime === null) this.leadState.nextTime = this.ctx.currentTime + 0.05;
    if (this.bassState.nextTime === null) this.bassState.nextTime = this.ctx.currentTime + 0.05;
    this.stepChannel(score.lead, this.leadState, 'square',   spu, 0.16);
    this.stepChannel(score.bass, this.bassState, 'triangle', spu, 0.22);
  },

  stepChannel(table, state, type, spu, peak) {
    const LOOKAHEAD = 0.15;
    while (state.nextTime < this.ctx.currentTime + LOOKAHEAD) {
      const [note, len] = table[state.idx % table.length];
      const dur = len * spu;
      if (note > 0) {
        const freq = 440 * Math.pow(2, (note - 69) / 12);
        this.tone(freq, type, dur * 0.9, peak, state.nextTime, this.musicGain);
      }
      state.nextTime += dur;
      state.idx++;
    }
  },
};

// SCENE TRANSITIONS
// ============================================================
// Full-screen black fade: 24 frames out, run midFn, 24 frames in.
// Stepped alpha only (8 discrete levels) — no smooth fades on NES.
const TRANS_OUT_FRAMES = 24, TRANS_IN_FRAMES = 24, TRANS_STEPS = 8;

const transition = {
  active: false,
  kind: null,
  frame: 0,
  midFn: null,
  midCalled: false,

  start(kind, midFn) {
    this.active    = true;
    this.kind      = kind;
    this.frame     = 0;
    this.midFn     = midFn;
    this.midCalled = false;
  },

  update() {
    if (!this.active) return;
    this.frame++;
    if (!this.midCalled && this.frame >= TRANS_OUT_FRAMES) {
      this.midCalled = true;
      if (this.midFn) this.midFn();
    }
    if (this.frame >= TRANS_OUT_FRAMES + TRANS_IN_FRAMES) this.active = false;
  },

  // 0 (clear) .. 1 (fully black), quantized to TRANS_STEPS discrete levels.
  alpha() {
    if (!this.active) return 0;
    const t = this.frame <= TRANS_OUT_FRAMES
      ? this.frame / TRANS_OUT_FRAMES
      : Math.max(0, 1 - (this.frame - TRANS_OUT_FRAMES) / TRANS_IN_FRAMES);
    return Math.ceil(t * TRANS_STEPS) / TRANS_STEPS;
  },

  draw() {
    if (!this.active) return;
    const a = this.alpha();
    if (a <= 0) return;
    ctx.fillStyle = `rgba(0,0,0,${a})`;
    ctx.fillRect(0, 0, GW, GH);
  },
};

function transitionToScene(mapId, heal) {
  AU.sfx('door');
  transition.start('fade', () => loadScene(mapId, heal));
}

const OBJ_BANNER_FRAMES = 180; // ~3s @ 60fps

function setObjective(text, silent) {
  if (game.objective === text) return;
  game.objective = text;
  if (!silent) game.objectiveBannerTimer = OBJ_BANNER_FRAMES;

function drawObjectiveBanner() {
  if (game.objectiveBannerTimer <= 0) return;
  const elapsed = OBJ_BANNER_FRAMES - game.objectiveBannerTimer;
  let y;
  if (elapsed < OBJ_BANNER_SLIDE) {
    y = -14 + Math.ceil(14 * elapsed / OBJ_BANNER_SLIDE);
  } else if (game.objectiveBannerTimer < OBJ_BANNER_SLIDE) {
    y = -14 + Math.ceil(14 * game.objectiveBannerTimer / OBJ_BANNER_SLIDE);
  } else {
    y = 0;
  }
  const label = '★ NEW OBJECTIVE: ' + game.objective;
  const bw2   = label.length * 6 + 12;
  const bx2   = Math.floor(GW/2 - bw2/2);
  px(bx2, y, bw2, 12, P.BLK);
  px(bx2, y+10, bw2, 2, P.YEL);
  drawText(label, bx2+6, y+9, P.YEL, 6);
  game.objectiveBannerTimer--;
}

// DIALOGUE SYSTEM
// ============================================================
const dlg = {
  active: false,
  lines: [],
  idx: 0,
  charIdx: 0,
  charTimer: 0,
  choices: null,
  choiceIdx: 0,
  onDone: null,
  speaker: '',
  speakerCol: P.WHT,
};

function startDialogue(lines, onDone) {
  dlg.active = true;
  dlg.lines   = lines;
  dlg.idx     = 0;
  dlg.charIdx = 0;
  dlg.charTimer = 0;
  dlg.choices = null;
  dlg.onDone  = onDone || null;
  game.state  = 'DIALOGUE';
  if (lines[0] && lines[0].speaker) {
    dlg.speaker    = lines[0].speaker;
    dlg.speakerCol = lines[0].col || P.WHT;
  }
}

function jumpTo(label) {
  const idx = dlg.lines.findIndex(l => l.label === label);
  if (idx !== -1) {
    dlg.idx     = idx;
    dlg.charIdx = 0;
    dlg.choices = null;
    dlg.choiceIdx = 0;
    updateSpeaker();
    // If the destination is itself a jump line, follow it immediately
    const dest = dlg.lines[idx];
    if (dest && dest.jump) jumpTo(dest.jump);
  }
}

function advanceDialogue() {
  const cur = dlg.lines[dlg.idx];

  // If still typing, jump to end of text
  if (cur && !cur.choices && !cur.jump && dlg.charIdx < (cur.text || '').length) {
    dlg.charIdx = (cur.text || '').length;
    return;
  }

  // Inline jump line (no text, just redirect)
  if (cur && cur.jump) {
    jumpTo(cur.jump);
    return;
  }

  // Choice line — confirm selection
  if (cur && cur.choices) {
    const chosen = cur.choices[dlg.choiceIdx];
    if (chosen.pick) { game.choices[chosen.pick[0]] = chosen.pick[1]; saveGame(); }
    if (chosen.jump) { jumpTo(chosen.jump); return; }
  }

  dlg.idx++;

  // Auto-skip jump lines
  while (dlg.idx < dlg.lines.length && dlg.lines[dlg.idx] && dlg.lines[dlg.idx].jump) {
    jumpTo(dlg.lines[dlg.idx].jump);
    return;
  }

  if (dlg.idx >= dlg.lines.length) {
    dlg.active  = false;
    dlg.choices = null;
    game.state  = 'EXPLORE';
    if (dlg.onDone) dlg.onDone();
    return;
  }

  dlg.charIdx   = 0;
  dlg.charTimer = 0;
  dlg.choices   = null;
  dlg.choiceIdx = 0;
  updateSpeaker();
}

function updateSpeaker() {
  const cur = dlg.lines[dlg.idx];
  if (cur && cur.speaker !== undefined) {
    dlg.speaker    = cur.speaker;
    dlg.speakerCol = cur.col || P.WHT;
  }
}

function updateDialogue() {
  const cur = dlg.lines[dlg.idx];
  if (!cur) return;

  if (cur.choices) {
    dlg.choices = cur.choices;
    if (justPressed['ArrowUp'])   dlg.choiceIdx = Math.max(0, dlg.choiceIdx - 1);
    if (justPressed['ArrowDown'])  dlg.choiceIdx = Math.min(cur.choices.length - 1, dlg.choiceIdx + 1);
    if (justPressed['KeyZ'])       advanceDialogue();
    return;
  }

  dlg.choices = null;
  if (dlg.charIdx < (cur.text || '').length) {
    const framesPerChar = TEXT_SPEED_FRAMES[game.textSpeed] ?? 2;
    if (framesPerChar === 0) {
      // INSTANT: reveal the whole line at once, no typewriter.
      dlg.charIdx = (cur.text || '').length;
      AU.sfx('text');
    } else {
      dlg.charTimer++;
      if (dlg.charTimer >= framesPerChar) {
        dlg.charTimer = 0;
        dlg.charIdx++;
        if (dlg.charIdx % 2 === 0) AU.sfx('text');
      }
    }
  }
  if (justPressed['KeyZ'] || justPressed['KeyX']) advanceDialogue();
}

// ============================================================
// DRAWING HELPERS
// ============================================================
function px(x, y, w, h, col) {
  ctx.fillStyle = col;
  ctx.fillRect(x, y, w, h);
}

function drawText(text, x, y, col, size) {
  ctx.fillStyle = col || P.WHT;
  ctx.font = `${size || 6}px monospace`;
  ctx.fillText(text, x, y);
}

function drawWrappedText(text, x, y, maxW, col, size) {
  const sz   = size || 6;
  const lineH = sz + 3;
  ctx.fillStyle = col || P.WHT;
  ctx.font = `${sz}px monospace`;
  const words = text.split(' ');
  let line = '';
  let cy   = y;
  for (const word of words) {
    const test = line ? line + ' ' + word : word;
    if (ctx.measureText(test).width > maxW && line) {
      ctx.fillText(line, x, cy);
      cy += lineH;
      line = word;
    } else {
      line = test;
    }
  }
  if (line) ctx.fillText(line, x, cy);
  return cy + lineH;
}

// Speaker -> 16x16 head-portrait renderer. Reuses the shared head-drawing
// helpers so portraits never drift from the in-game character sprites.
// Speakers not listed here (narrator '', DISPATCH) render with no portrait.
const PORTRAIT_DRAW = {
  BECK:     (sx, sy) => drawBeckHead(sx, sy),
  INDY:     (sx, sy) => drawNPCHead(sx, sy, {id:'indy',     col:P.PNK}),
  STERLING: (sx, sy) => drawNPCHead(sx, sy, {id:'sterling', col:P.LBLU}),
  KANE:     (sx, sy) => drawNPCHead(sx, sy, {id:'kane',     col:P.LGRY}),
};

// 8-bit style dialog box
function drawDialogueBox() {
  if (!dlg.active) return;
  const cur = dlg.lines[dlg.idx];
  if (!cur) return;

  const bx = 4, by = GH - 66, bw = GW - 8, bh = 62;

  // Box bg + border
  px(bx,   by,   bw,   bh,   P.BLK);
  px(bx,   by,   bw,   2,    P.WHT);
  px(bx,   by+bh-2, bw, 2,  P.WHT);
  px(bx,   by,   2,    bh,   P.WHT);
  px(bx+bw-2, by, 2,   bh,   P.WHT);
  px(bx+2, by+2, bw-4, bh-4, '#0C0C1C');

  // Speaker name
  if (dlg.speaker) {
    px(bx+4, by-10, dlg.speaker.length * 6 + 8, 12, P.BLK);
    px(bx+4, by-10, dlg.speaker.length * 6 + 8, 2,  dlg.speakerCol);
    drawText(dlg.speaker, bx+8, by-2, dlg.speakerCol, 6);
  }

  // Portrait — 16x16 box at left; remaining text shifts right by 24px.
  const portraitFn = PORTRAIT_DRAW[dlg.speaker];
  const shift = portraitFn ? 24 : 0;
  if (portraitFn) {
    const ppx = bx + 5, ppy = by + 5;
    px(ppx-1, ppy-1, 18, 18, dlg.speakerCol);
    px(ppx, ppy, 16, 16, '#0C0C1C');
    portraitFn(ppx + 1, ppy + 2);
  }

  if (cur.choices) {
    // Draw choices
    drawText('Choose:', bx+8+shift, by+12, P.LGRY, 6);
    cur.choices.forEach((ch, i) => {
      const cy = by + 22 + i * 13;
      const sel = i === dlg.choiceIdx;
      if (sel) px(bx+8+shift, cy-7, bw-16-shift, 11, '#1C1C3C');
      drawText((sel ? '▶ ' : '  ') + ch.text, bx+12+shift, cy, sel ? P.YEL : P.LGRY, 6);
    });
    return;
  }

  // Draw typed text
  const displayed = (cur.text || '').substring(0, dlg.charIdx);
  drawWrappedText(displayed, bx+8+shift, by+14, bw-20-shift, P.WHT, 6);

  // Blinking arrow if done
  if (dlg.charIdx >= (cur.text || '').length) {
    if (Math.floor(game.frame / 20) % 2 === 0)
      drawText('▼', bx+bw-12, by+bh-6, P.YEL, 6);
  }
}

// BECK SPRITE  — pixel art, 14px wide × 28px tall, Zelda-style

const BECK_COL = {
  HA:'#7B3F00', HB:'#C07030', HC:'#3A1E00',
  SK:'#FFCC9A', EY:'#180800', EW:'#E8E0C8', MC:'#C87060',
  HO:'#008888', HS:'#005555', JN:'#2858C0', JD:'#162E70', SH:'#181008',
};

// Shared head-only piece (front-facing), reused by drawBeck('down') and
// the dialogue-portrait renderer so the two never drift out of sync.
function drawBeckHead(sx, sy) {
  const {HA,HB,HC,SK,EW,EY,MC} = BECK_COL;
  function r(x,y,w,h,c) { ctx.fillStyle=c; ctx.fillRect(sx+x,sy+y,w,h); }
  r(2, 0,10, 2,HA); r(3, 1, 8, 1,HB);          // hair crown
  r(0, 2, 3, 9,HA); r(11,2, 3, 9,HA);           // hair curtains
  r(3, 2, 8, 7,SK);                              // face skin
  r(3, 3, 8, 1,HA);                              // hairline
  r(3, 5, 3, 1,HC); r(8, 5, 3, 1,HC);           // eyebrows
  r(3, 6, 3, 2,EW); r(8, 6, 3, 2,EW);           // eye whites
  r(4, 7, 1, 1,EY); r(9, 7, 1, 1,EY);           // irises
  r(5, 9, 4, 1,MC);                              // mouth
  r(5,10, 4, 2,SK);                              // neck
}

function drawBeck(sx, sy, dir, fr) {
  if (pl.invincible > 0 && Math.floor(game.frame / 4) % 2) return;

  const {HA,HB,HC,SK,EY,EW,MC,HO,HS,JN,JD,SH} = BECK_COL;

  function r(x,y,w,h,c) { ctx.fillStyle=c; ctx.fillRect(sx+x,sy+y,w,h); }
  const aO = fr ? 1 : 0;

  if (dir === 'down') {
    drawBeckHead(sx, sy);
    r(2,12,10, 7,HO); r(6,12, 2, 7,HS);           // hoodie body + zip
    r(0,12-aO,2,7,HO); r(12,12+aO,2,7,HO);        // arms
    r(1,12,   1,7,HA); r(13,12,   1,7,HA);         // hair tails over arms
    r(0,19-aO,2,2,SK); r(12,19+aO,2,2,SK);        // hands
    r(3,19, 8, 3,JN); r(6,19, 2, 3,JD);           // jeans
    r(3,22, 3,3+aO,JN); r(8,22,3,3-aO,JN);        // legs
    r(2,25+aO,5,2,SH); r(7,25-aO,5,2,SH);         // shoes

  } else if (dir === 'up') {
    r(2, 0,10, 2,HA); r(5, 1, 4, 1,HB);           // crown
    r(0, 2,14,10,HA); r(4, 2, 6, 9,HB);           // back of head — all hair
    r(5,12, 4, 1,SK);                              // neck (tiny)
    r(2,13,10, 6,HO); r(6,13, 2, 6,HS);           // hoodie
    r(0,13-aO,2,7,HO); r(12,13+aO,2,7,HO);        // arms
    r(1,13,   1,7,HA); r(13,13,   1,7,HA);         // hair tails
    r(0,20-aO,2,2,SK); r(12,20+aO,2,2,SK);        // hands
    r(3,19, 8, 3,JN); r(6,19, 2, 3,JD);           // jeans
    r(3,22, 3,3+aO,JN); r(8,22,3,3-aO,JN);        // legs
    r(2,25+aO,5,2,SH); r(7,25-aO,5,2,SH);         // shoes

  } else if (dir === 'left') {
    r(7, 0, 7,14,HA); r(8, 1, 5,12,HB);           // hair trailing right
    r(1, 2, 6, 7,SK);                              // face profile
    r(1, 3, 6, 1,HA);                              // hairline
    r(2, 5, 3, 1,HC);                              // eyebrow
    r(1, 6, 4, 2,EW); r(1, 7, 1, 1,EY);           // eye
    r(1, 9, 3, 1,MC);                              // mouth
    r(3,10, 3, 2,SK);                              // neck
    r(2,12, 9, 7,HO); r(2,12, 2, 7,HS);           // hoodie + front shadow
    r(0,12-aO,2,7,HO); r(11,12+aO,2,7,HO);        // arms
    r(0,19-aO,2,2,SK); r(11,19+aO,2,2,SK);        // hands

// Hair colour per character, shared by the body sprite and the

const NPC_HAIR = {

  sterling: ['#1C1C1C','#383838'], // Sterling — dark/grey suit
  kane:     ['#808080','#A0A0A0'], // Kane — silver hair

// Shared head-only piece (front-facing), reused by drawNPCChar and the
// dialogue-portrait renderer.
function drawNPCHead(sx, sy, npc) {
  function r(x,y,w,h,c){ ctx.fillStyle=c; ctx.fillRect(sx+x,sy+y,w,h); }
  const [hA, hB] = NPC_HAIR[npc.id] || (npc.guard ? ['#1C1C1C','#000000'] : ['#3C2400','#5C3800']);
  const col = npc.col;

  // Hair
  r(3,0, 8,2, hA); r(2,1,10,2, hA);
  // Indy has slightly shorter hair (to ~row 14, not 22)
  const hairLen = (npc.id==='indy') ? 13 : 6;
  r(0,2, 3, hairLen, hA); r(11,2, 3, hairLen, hA);
  r(1,3, 1, hairLen-2, hB); r(12,3, 1, hairLen-2, hB);

  // Face
  r(3,2, 8,9, P.SKN);
  r(3,2, 8,1, hA);        // hairline
  r(3,4, 3,1, hA);        // left brow
  r(8,4, 3,1, hA);        // right brow
  r(3,5, 3,2, '#F0F0E8'); // left eye (x=3-5)
  r(8,5, 3,2, '#F0F0E8'); // right eye (x=8-10) — 2px gap between
  r(4,6, 1,1, col);       // left iris
  r(9,6, 1,1, col);       // right iris
  r(5,9, 4,1, '#C08070'); // mouth

  // Neck
  r(5,11, 4,2, P.SKN);
}

function drawNPCChar(sx, sy, npc, fr) {
  function r(x,y,w,h,c){ ctx.fillStyle=c; ctx.fillRect(sx+x,sy+y,w,h); }

  const id  = npc.id;

  // Body/suit colour
  const bodyCol = (id==='indy') ? '#E84898' : (id==='sterling') ? '#2858A0'
                : (id==='kane')  ? '#505050'  : (npc.patrol) ? '#282828'
                : (npc.wander || npc.seated) ? npc.col : '#800000';

  // Seated cafeteria students (M4-T2): chair-back rect drawn first, then
  // torso/arms only — no legs, no walk-cycle offsets.
  if (npc.seated) {
    r(2,10, 10,11, '#402C1C');   // chair back
    drawNPCHead(sx, sy, npc);
    r(3,13, 8,7, bodyCol);       // torso (short — seated at table height)
    r(6,13, 2,7, '#00000030');   // seam
    r(1,14, 2,5, bodyCol);       // arms
    r(11,14,2,5, bodyCol);
    return;
  }

  drawNPCHead(sx, sy, npc);

  // Body
  r(3,13, 8,8, bodyCol);
  r(6,13, 2,8, '#00000030');  // seam
  if (npc.patrol) r(3,18, 8,2, P.YEL); // flashlight-yellow belt trim

  // Arms
  const aO = fr ? 1 : 0;
  r(1,13-aO, 2,7, bodyCol);
  r(11,13+aO,2,7, bodyCol);

  // Legs
  const lO = fr ? 1 : 0;
  r(3,21, 8,4, '#1A3878');
  r(3,24, 3,4+lO,   '#1A3878');
  r(8,24, 3,4-lO+1, '#1A3878');

  // Shoes
  r(2,27+lO, 5,2, '#281808');
  r(7,28-lO, 5,2, '#281808');
}

function drawPlayer() {
  const sx = pl.x - cam.x - 1;

function drawNPC(npc) {
  if (!npc.active) return;

// M6-T3: hoisted out of the per-tile hot loop below (was a fresh array
// literal per window tile per frame).
const WINDOW_RAIN_COLS = [2, 4, 11, 13];

function drawMap() {
  const map  = MAPS[game.mapId];
  const rows = map.rows;
  // Background
  ctx.fillStyle = map.bgCol;
  ctx.fillRect(0, 0, GW, GH);

  const startTX = Math.floor(cam.x / TW);
  const startTY = Math.floor(cam.y / TH);
  const endTX   = Math.min(map.w, startTX + Math.ceil(GW/TW) + 1);
  const endTY   = Math.min(map.h, startTY + Math.ceil(GH/TH) + 1);

  for (let ty = startTY; ty < endTY; ty++) {
    for (let tx = startTX; tx < endTX; tx++) {
      if (!rows[ty]) continue;
      const id  = rows[ty][tx];
      const def = T[id];
      if (!def) continue;
      const sx  = tx * TW - cam.x;
      const sy  = ty * TH - cam.y;

      ctx.fillStyle = def.c;
      ctx.fillRect(sx, sy, TW, TH);

      // Tile details
      if (id === 4) { // computer screen glow
        const g = Math.floor(game.frame/8)%2 ? '#20F8F8' : '#10D8E8';
        px(sx+2, sy+2, 12, 10, g);
        px(sx+4, sy+4, 8, 6, '#CCFFFF');
      } else if (id === 2) { // bed
        px(sx+1, sy+1, 14, 6, '#9060C0'); // pillow
        px(sx+1, sy+7, 14, 8, '#5030A0'); // sheet
      } else if (id === 12) { // exit zone — flashes faster once the finale is live
        const rate = game.dockChaseActive ? 6 : 15;
        const glowF = Math.floor(game.frame/rate)%2;
        px(sx, sy, TW, TH, glowF ? '#30A840' : '#206830');
        drawText('EXIT', sx+1, sy+10, game.dockChaseActive ? P.WHT : P.YEL, 5);
      } else if (id === 16) { // evidence crate
        px(sx+1, sy+1, 14, 14, '#2C4830');
        px(sx+3, sy+3, 10, 10, '#1C3820');
        if (Math.floor(game.frame/20)%2)
          px(sx+6, sy+6, 4, 4, P.AMB);
      } else if (id === 15) { // lockers
        for (let i=0;i<2;i++) {
          px(sx+1+i*8, sy+2, 6, TH-4, '#3C3028');
          px(sx+1+i*8, sy+TH/2, 6, 1, '#2C2018');
          px(sx+5+i*8, sy+4, 2, 2, '#787060');
        }
      } else if (id === 5) { // window (bedroom) — animated rain (M4-T3)
        px(sx+1, sy+1, 14, 14, '#1C2C48');
        px(sx+7, sy+1, 2,  14, '#142338');
        px(sx+1, sy+7, 14, 2,  '#142338');
        for (let i = 0; i < WINDOW_RAIN_COLS.length; i++) {
          const ry = sy + 1 + ((game.frame*2 + i*5) % 14);
          px(sx + WINDOW_RAIN_COLS[i], ry, 1, 3, '#78B0E8');
        }
      } else if (id === 11) { // fence
        px(sx+7, sy, 2, TH, '#555555');
        for (let fy=0;fy<TH;fy+=4) px(sx, sy+fy, TW, 1, '#444444');
      } else if (id === 19) { // cafeteria table — with food trays (M4-T2)

        px(sx+1, sy+3, 14, 2,  '#705838');
        px(sx+2,  sy+6, 5, 4, '#B8B8B8');  // tray
        px(sx+3,  sy+7, 1, 1, P.RED);      // food blob
        px(sx+9,  sy+6, 5, 4, '#B8B8B8');  // second tray

        px(sx+3, sy+9, 4, 4, P.LGRN);
        px(sx+9, sy+9, 4, 4, P.LBLU);

        px(sx+1, sy+1, 14, 14, '#403828');
        px(sx+2, sy+2, 12, 12, '#8CB8D8');
        px(sx+6, sy+9, 4, 5, P.AMB);   // trophy cup
        px(sx+7, sy+6, 2, 4, P.AMB);
      } else if (id === 26) { // cafeteria lunch-line counter (M4-T2)
        px(sx, sy+8, TW, 8, '#403020');
        px(sx, sy+6, TW, 2, '#684C2C');

        px(sx+10, sy+2, 4, 4, '#B8B8B8');
      } else if (id === 9) { // shipping crate — plank + cross brace
        px(sx+1, sy+1, 14, 14, '#6C4820');

        px(sx+7, sy+1, 2,  14, '#4C3010');

        px(sx+2, sy+2, 2, 2, '#3C2408');

      } else if (id === 8) { // dock floor — horizontal plank boards
        ctx.fillStyle = '#060E18';
        ctx.fillRect(sx, sy,   TW, 1);   // board seam top
        ctx.fillRect(sx, sy+8, TW, 1);   // board seam mid
        ctx.fillStyle = '#0A1828';
        ctx.fillRect(sx+4,  sy+3,  1, 1); // nail
        ctx.fillRect(sx+11, sy+11, 1, 1); // nail
      } else if (id === 17) { // dock shadow floor (inside sheds)
        ctx.fillStyle = '#0F0D16';
        ctx.fillRect(sx, sy,   TW, 1);
        ctx.fillRect(sx, sy+8, TW, 1);
      } else if (id === 10) { // metal container wall — rivets + edge shading
        ctx.fillStyle = '#607898';
        ctx.fillRect(sx, sy,       TW, 2); // highlight top edge
        ctx.fillStyle = '#283C50';
        ctx.fillRect(sx, sy+TH-2, TW, 2); // shadow bottom edge
        ctx.fillStyle = '#3A5870';         // rivets
        ctx.fillRect(sx+2,  sy+4,  2, 2);
        ctx.fillRect(sx+10, sy+4,  2, 2);
        ctx.fillRect(sx+2,  sy+10, 2, 2);
        ctx.fillRect(sx+10, sy+10, 2, 2);
      } else if (id === 20) { // dock border — bevelled edge
        ctx.fillStyle = '#201808';
        ctx.fillRect(sx+1, sy,       TW-2, 1); // top groove
        ctx.fillRect(sx,   sy,       1, TH);   // left groove
        ctx.fillRect(sx+TW-1, sy,    1, TH);   // right groove
        ctx.fillStyle = '#484020';
        ctx.fillRect(sx+2, sy+2, TW-4, 1);     // inner highlight
      } else if (id === 1) { // bedroom floor — tile grid
        ctx.fillStyle = '#2C2440';
        ctx.fillRect(sx, sy,   TW, 1);
        ctx.fillRect(sx, sy,   1,  TH);
      } else if (id === 13 || id === 18) { // school / cafe floor
        ctx.fillStyle = '#5A4C3A';
        ctx.fillRect(sx, sy,   TW, 1);
        ctx.fillRect(sx, sy,   1,  TH);

  // Item indicators (only if not found)
  const map2 = MAPS[game.mapId];
  map2.items.forEach(item => {
    if (game.evidenceFound.includes(item.id)) return;
    if (item.id === 'computer') return; // always show computer
    if (item.flavor) return; // flavor items are found by exploring, not flagged
    const sx = item.tx * TW - cam.x;
    const sy = item.ty * TH - cam.y;
    if (Math.floor(game.frame/15)%2===0) {
      // M6-T2: colorblind check — a pulsing corner outline gives the
      // marker a shape signal independent of the amber fill, so it still
      // reads without relying on color alone.
      const pr = (Math.floor(game.frame/8) % 2) ? 3 : 1;
      px(sx+4-pr,  sy-6-pr, 1, 1, P.WHT);
      px(sx+11+pr, sy-6-pr, 1, 1, P.WHT);

      px(sx+4, sy-6, 8, 6, P.AMB);
      drawText('!', sx+6, sy-2, P.BLK, 5);

  if (game.mapId === 'bedroom') drawBedroomDecor();

  drawEvidenceEffects();
}

// ============================================================
// COLLISION
// ============================================================
function tileSolid(tx, ty) {
  const map  = MAPS[game.mapId];
  if (tx < 0 || ty < 0 || tx >= map.w || ty >= map.h) return true;
  const id   = map.rows[ty][tx];
  const def  = T[id];
  return def ? def.s : true;
}

function rectSolid(x, y, w, h) {
  const x2 = x + w - 1;
  const y2 = y + h - 1;
  return (
    tileSolid(Math.floor(x/TW),  Math.floor(y/TH))  ||
    tileSolid(Math.floor(x2/TW), Math.floor(y/TH))  ||
    tileSolid(Math.floor(x/TW),  Math.floor(y2/TH)) ||
    tileSolid(Math.floor(x2/TW), Math.floor(y2/TH))
  );
}

// ============================================================
// PLAYER MOVEMENT
// ============================================================
function updatePlayer() {
  if (game.state !== 'EXPLORE') return;

  let dx = 0, dy = 0;
  if (keys['ArrowLeft'] || keys['KeyA'])  dx = -pl.speed;
  if (keys['ArrowRight']|| keys['KeyD'])  dx =  pl.speed;
  if (keys['ArrowUp']   || keys['KeyW'])  dy = -pl.speed;
  if (keys['ArrowDown'] || keys['KeyS'])  dy =  pl.speed;

  if (dx && dy) { dx *= 0.707; dy *= 0.707; }

  pl.moving = dx !== 0 || dy !== 0;

  if (pl.moving) {
    if (Math.abs(dx) >= Math.abs(dy)) {
      pl.dir = dx > 0 ? 'right' : 'left';
    } else {
      pl.dir = dy > 0 ? 'down' : 'up';
    }
    pl.frameTimer++;
    if (pl.frameTimer >= 12) { pl.frameTimer = 0; pl.frame = 1 - pl.frame; }
    dustStepTimer++;
    if (dustStepTimer >= 8) { dustStepTimer = 0; spawnDust(pl.x + pl.w/2 - 1, pl.y + pl.h - 2); }
  } else {
    pl.frame = 0;
    dustStepTimer = 0;
  }

  const nx = pl.x + dx;
  const ny = pl.y + dy;
  const margin = 2;

  if (!rectSolid(nx + margin, pl.y + margin, pl.w - margin*2, pl.h - margin*2))
    pl.x = nx;
  if (!rectSolid(pl.x + margin, ny + margin, pl.w - margin*2, pl.h - margin*2))
    pl.y = ny;

  if (pl.invincible > 0) pl.invincible--;
}

// ============================================================
// INTERACTION CHECK
// ============================================================
function checkInteract() {
  if (!justPressed['KeyZ']) return;
  if (game.state !== 'EXPLORE') return;

  const cx = pl.x + pl.w/2;
  const cy = pl.y + pl.h/2;
  const map = MAPS[game.mapId];

  // Check items
  for (const item of map.items) {
    const ix = item.tx * TW + TW/2;
    const iy = item.ty * TH + TH/2;
    if (Math.abs(cx - ix) < TW * 1.5 && Math.abs(cy - iy) < TH * 1.5) {
      handleItem(item);
      return;
    }
  }

  // Check NPCs
  for (const npc of map.npcs) {
    if (!npc.active || npc.guard || npc.id === 'cafe_arrow') continue;
    const nx = npc.x + 6;
    const ny = npc.y + 7;
    if (Math.abs(cx - nx) < TW * 2 && Math.abs(cy - ny) < TH * 2) {
      handleNPC(npc);
      return;
    }
  }
}

    ] : lines, () => {
      if (allFound) triggerDockFinale();
    });
    return;
  }

  if (item.id.startsWith('evidence_') && game.evidenceFound.includes(item.id)) {
    startDialogue([{speaker:'', text:'Already documented.'}]);
  }
}

const pause = { tab: 0, optIdx: 0, confirmRestart: false };

function openPause() {
  game.pausedFrom = game.state;
  game.state = 'PAUSED';
  pause.tab = 0;
  pause.optIdx = 0;
  pause.confirmRestart = false;
  AU.sfx('confirm');
}

function closePause() {
  game.state = game.pausedFrom;
  AU.sfx('cancel');
}

function updatePause() {
  if (justPressed['ArrowLeft'])  { pause.tab = (pause.tab + 2) % 3; pause.confirmRestart = false; AU.sfx('cancel'); }
  if (justPressed['ArrowRight']) { pause.tab = (pause.tab + 1) % 3; pause.confirmRestart = false; AU.sfx('cancel'); }

  if (pause.tab !== 2) return; // only OPTIONS tab has interactive rows

  if (pause.confirmRestart) {
    if (justPressed['KeyZ']) { clearSave(); restartGame(); }
    if (justPressed['KeyX']) { pause.confirmRestart = false; AU.sfx('cancel'); }
    return;
  }
  if (justPressed['ArrowUp'])   pause.optIdx = Math.max(0, pause.optIdx - 1);
  if (justPressed['ArrowDown']) pause.optIdx = Math.min(2, pause.optIdx + 1);
  if (justPressed['KeyZ']) {
    if (pause.optIdx === 0) AU.toggleMute();
    else if (pause.optIdx === 1) { cycleTextSpeed(); AU.sfx('confirm'); }
    else { pause.confirmRestart = true; AU.sfx('cancel'); }
  }
}

  tabs.forEach((t, i) => {

    const opts = ['MUTE: ' + (AU.muted ? 'ON' : 'OFF'), 'TEXT SPEED: ' + game.textSpeed, 'RESTART CHAPTER'];
    opts.forEach((label, i) => {
      const sel = i === pause.optIdx;

}

// ============================================================
// GUARD AI — patrol, vision cones, CALM/SUSPICIOUS/ALERT (M3-T1, M3-T2)
// ============================================================
const CONE_RANGE       = 56;
const CONE_HALF_ANGLE  = 35 * Math.PI / 180;
// M6-T3: the 3 discrete alpha steps a cone ray can use, precomputed so
// drawGuardCone doesn't build a fresh rgba(...) string every ray/frame.
const CONE_ALPHA_NEAR = 'rgba(248,216,0,0.28)';
const CONE_ALPHA_MID  = 'rgba(248,216,0,0.16)';
const CONE_ALPHA_FAR  = 'rgba(248,216,0,0.08)';
const SUSPICIOUS_FRAMES = 45;  // 0.75s @ 60fps
const LOSE_SIGHT_FRAMES = 180; // 3s @ 60fps
const GUARD_FACING_ANGLE = {down: Math.PI/2, up: -Math.PI/2, left: Math.PI, right: 0};

function patrolGuard(g) {
  const target = g.waypoints[g.wpIdx];
  const dx = target.x - g.x, dy = target.y - g.y;
  const dist = Math.hypot(dx, dy);
  if (dist < 2) {
    g.wpIdx = (g.wpIdx + 1) % g.waypoints.length;
    return;
  }
  g.x += (dx / dist) * g.patrolSpeed;
  g.y += (dy / dist) * g.patrolSpeed;
  g.dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
}

function faceTowardPlayer(g) {
  const dx = (pl.x + pl.w/2) - (g.x + g.w/2);
  const dy = (pl.y + pl.h/2) - (g.y + g.h/2);
  g.dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
}

function pursuePlayer(g, speed) {
  const dx = (pl.x + pl.w/2) - (g.x + g.w/2);
  const dy = (pl.y + pl.h/2) - (g.y + g.h/2);
  const dist = Math.hypot(dx, dy);
  if (dist <= 4) return;
  const nx = g.x + (dx/dist) * speed, ny = g.y + (dy/dist) * speed;
  const m = 2;
  if (!rectSolid(nx + m, g.y + m, g.w - m*2, g.h - m*2)) g.x = nx;
  if (!rectSolid(g.x + m, ny + m, g.w - m*2, g.h - m*2)) g.y = ny;
  g.dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
}

// Facing cone + step-every-4px line of sight; blocked by any solid tile.
// Standing on a shadow tile (SH) hides Beck from every guard's cone.
function playerInShadow() {
  const map = MAPS[game.mapId];
  const tx = Math.floor((pl.x + pl.w/2) / TW);
  const ty = Math.floor((pl.y + pl.h/2) / TH);
  const row = map.rows[ty];
  return !!row && row[tx] === SH;
}

let wasInShadow = false;
function updateShadowTeach() {
  const inShadow = playerInShadow();
  if (inShadow && !wasInShadow && !game.shadowTaught) {
    game.shadowTaught = true;
    showToast('Shadows hide you.');
  }
  wasInShadow = inShadow;
}

function guardSeesPlayer(g) {
  if (playerInShadow()) return false;
  const gx = g.x + g.w/2, gy = g.y + g.h/2;
  const tx = pl.x + pl.w/2, ty = pl.y + pl.h/2;
  const dx = tx - gx, dy = ty - gy;
  const dist = Math.hypot(dx, dy);
  if (dist > CONE_RANGE) return false;

  const facing = GUARD_FACING_ANGLE[g.dir] || 0;
  let diff = Math.atan2(dy, dx) - facing;
  diff = Math.atan2(Math.sin(diff), Math.cos(diff)); // wrap to [-PI, PI]
  if (Math.abs(diff) > CONE_HALF_ANGLE) return false;

  const steps = Math.max(1, Math.ceil(dist / 4));
  for (let i = 1; i < steps; i++) {
    const t = i / steps;
    if (tileSolid(Math.floor((gx + dx*t) / TW), Math.floor((gy + dy*t) / TH))) return false;
  }
  return true;
}

function returnGuardToPatrol(g) {
  g.state = 'CALM';
  if (!g.patrol) return;
  let nearest = 0, best = Infinity;
  g.waypoints.forEach((wp, i) => {
    const d = Math.hypot(wp.x - g.x, wp.y - g.y);
    if (d < best) { best = d; nearest = i; }
  });
  g.wpIdx = nearest;
}

function checkGuardCollision(g) {
  if (g.cooldown > 0 || pl.invincible > 0) return;
  const gx = g.x + g.w/2, gy = g.y + g.h/2;
  if (Math.abs((pl.x+pl.w/2) - gx) < 12 && Math.abs((pl.y+pl.h/2) - gy) < 12) {
    pl.hearts--;
    pl.invincible = 80;
    g.cooldown = 60;
    showDamageFlash();
    AU.sfx('hurt');
    if (pl.hearts <= 0) {
      startDialogue([
        {speaker:'', text:'CAUGHT! A guard grabbed you.'},
        {speaker:'', text:'Evidence still secured. You break free and run.'},
        {speaker:'', text:'Try again — reach the EXIT at the top of the dock!'},
      ], resetDockFinaleEncounter);
    }
  }
}

function updateGuards() {
  if (game.mapId !== 'dock') return;
  const map = MAPS['dock'];

  map.npcs.forEach(g => {
    if (!g.guard || !g.active) return;
    if (g.cooldown > 0) g.cooldown--;

    // M3-T4: once the finale is live every guard (including the
    // smuggler, guard #4) is permanently ALERT — no cone/timeout logic.
    if (game.dockChaseActive) {
      g.state = 'ALERT';
      pursuePlayer(g, g.alertSpeed);
      checkGuardCollision(g);
      return;
    }

    if (!g.patrol) return; // smuggler (guard #4) stays dormant until the finale

    if (g.state === 'CALM') {
      patrolGuard(g);
      if (guardSeesPlayer(g)) { g.state = 'SUSPICIOUS'; g.susTimer = SUSPICIOUS_FRAMES; }
    } else if (g.state === 'SUSPICIOUS') {
      faceTowardPlayer(g);
      if (guardSeesPlayer(g)) {
        g.susTimer--;
        if (g.susTimer <= 0) {
          g.state = 'ALERT';
          g.sightTimer = LOSE_SIGHT_FRAMES;
          AU.sfx('alert');
          AU.music('chase');
        }
      } else {
        g.state = 'CALM';
      }
    } else if (g.state === 'ALERT') {
      pursuePlayer(g, g.alertSpeed);
      checkGuardCollision(g);
      if (guardSeesPlayer(g)) g.sightTimer = LOSE_SIGHT_FRAMES; else g.sightTimer--;
      if (g.sightTimer <= 0) {
        returnGuardToPatrol(g);
        const stillAlert = map.npcs.some(o => o.guard && o.active && o.state === 'ALERT');
        if (!stillAlert) AU.music('dock');
      }
    }
  });

  checkDockExit();
}

// Translucent stepped-alpha yellow triangle of small rects — no ctx paths.
// Hidden once a guard is ALERT (it's beelining for the player, not scanning).
function drawGuardCone(g) {
  if (g.state === 'ALERT') return;
  const gx = g.x - cam.x + g.w/2, gy = g.y - cam.y + g.h/2;
  const facing = GUARD_FACING_ANGLE[g.dir] || 0;
  for (let i = 0; i <= 8; i++) {
    const a = facing - CONE_HALF_ANGLE + (2 * CONE_HALF_ANGLE) * (i / 8);
    const cos = Math.cos(a), sin = Math.sin(a);
    for (let d = 8; d <= CONE_RANGE; d += 8) {
      ctx.fillStyle = d < CONE_RANGE/3 ? CONE_ALPHA_NEAR : d < CONE_RANGE*2/3 ? CONE_ALPHA_MID : CONE_ALPHA_FAR;
      ctx.fillRect(Math.round(gx + cos*d) - 1, Math.round(gy + sin*d) - 1, 2, 2);
    }
  }
}

// Blinking '?' (SUSPICIOUS) / '!' (ALERT) above a guard's head.
function drawGuardStateIcon(g, sx, sy) {
  if (g.state === 'CALM' || Math.floor(game.frame/10) % 2 === 0) return;
  const icon = g.state === 'SUSPICIOUS' ? '?' : '!';
  const col2 = g.state === 'SUSPICIOUS' ? P.YEL : P.RED;
  px(sx+4, sy-9, 7, 8, P.BLK);
  drawText(icon, sx+6, sy-3, col2, 7);
}

// ============================================================
// DOCK FINALE (M3-T4) — every guard permanently ALERT, race the EXIT
// ============================================================
// Replaces the old single-smuggler DOCK_CHASE special case: the finale
// now runs inside plain EXPLORE, gated by the game.dockChaseActive flag,
// and reuses the same guard state machine as the stealth phase.
function triggerDockFinale() {
  game.dockChaseActive = true;
  MAPS['dock'].npcs.forEach(g => {
    if (!g.guard) return;
    g.active     = true;
    g.state      = 'ALERT';
    g.sightTimer = LOSE_SIGHT_FRAMES;
  });
  AU.music('chase');
}

function resetDockFinaleEncounter() {
  pl.hearts     = 3;
  pl.x          = MAPS['dock'].playerSpawn.x;
  pl.y          = MAPS['dock'].playerSpawn.y;
  pl.invincible = 120;
  MAPS['dock'].npcs.forEach(g => { if (g.guard) g.cooldown = 0; });
}

function checkDockExit() {
  if (!game.dockChaseActive) return;
  const exitTX = 8, exitTY = 0;
  const exitX  = exitTX * TW;
  const exitY  = exitTY * TH;
  if (pl.x + pl.w > exitX && pl.x < exitX + TW && pl.y < exitY + TH*2) {
    game.dockChaseActive = false;
    MAPS['dock'].npcs.forEach(g => { if (g.guard) g.active = false; });
    AU.sfx('success');
    startDialogue([
      {speaker:'', text:'You hit the street at full speed.'},
      {speaker:'BECK', col:P.TEL, text:'All 43 photos intact.'},
      {speaker:'', text:'You send the evidence to the police, the FBI, and three journalists.'},
      {speaker:'', text:'Four days later: FEDERAL RAID ON EAST DOCK — $4.2M IN WEAPONS SEIZED.'},
      {speaker:'', text:'Nobody knows it was you.'},
      {speaker:'', text:'Two weeks pass. Then something strange happens at school...'},
    ], () => { setObjective('Find Indy at school.', true); transitionToScene('school'); });
  }
}

// ============================================================
// FEEL PASS — footstep dust, evidence pop, heart restore
// ============================================================
// Fixed-size pools, no per-frame allocation.
const DUST = Array.from({length: 16}, () => ({active:false, x:0, y:0, timer:0}));
let dustStepTimer = 0;

function spawnDust(x, y) {
  const d = DUST.find(p => !p.active);
  if (!d) return;
  d.active = true; d.x = x; d.y = y; d.timer = 14;
}

function updateDust() {

function drawDust() {
  for (const d of DUST) {
    if (!d.active) continue;
    const sx = d.x - cam.x, sy = d.y - cam.y;
    px(sx, sy, 2, 2, d.timer > 7 ? '#B0A088' : '#655848');

}

const EVIDENCE_FX = Array.from({length: 4}, () => ({active:false, tx:0, ty:0, timer:0}));
function spawnEvidenceEffect(tx, ty) {
  const e = EVIDENCE_FX.find(p => !p.active);
  if (!e) return;
  e.active = true; e.tx = tx; e.ty = ty; e.timer = 6;
}

function drawEvidenceEffects() {
  for (const e of EVIDENCE_FX) {
    if (!e.active) continue;
    const sx = e.tx * TW - cam.x, sy = e.ty * TH - cam.y;
    if (e.timer > 4) px(sx, sy, TW, TH, '#FFFFFF'); // white flash, first 2 frames
    const step = 6 - e.timer;               // 0..5, stepped scale-in
    const size = 2 + Math.min(step, 3) * 2; // 2,4,6,8,8,8
    px(sx + TW/2 - size/2, sy - size, size, size, P.AMB);
    e.timer--;
    if (e.timer <= 0) e.active = false;
  }
}

// ============================================================
// WANDERING NPCS — random-waypoint students (M4-T1)
// ============================================================
// On reaching a target, pause briefly then pick a new random point
// inside the NPC's wanderBounds. Bounds are kept well inside the open
// floor so rectSolid() never needs to route them around obstacles.
function updateWanderers() {
  const map = MAPS[game.mapId];
  map.npcs.forEach(n => {
    if (!n.wander || !n.active) return;

    if (n.wanderPause > 0) { n.wanderPause--; return; }

    if (!n.wanderTarget) {
      const b = n.wanderBounds;
      n.wanderTarget = {
        x: b.x0 + Math.random() * (b.x1 - b.x0),
        y: b.y0 + Math.random() * (b.y1 - b.y0),
      };
    }

    const dx = n.wanderTarget.x - n.x, dy = n.wanderTarget.y - n.y;
    const dist = Math.hypot(dx, dy);
    if (dist < 3) {
      n.wanderTarget = null;
      n.wanderPause = 60 + Math.floor(Math.random() * 120); // idle 1-3s
      return;
    }

    const nx = n.x + (dx / dist) * n.wanderSpeed;
    const ny = n.y + (dy / dist) * n.wanderSpeed;
    const m = 2;
    if (!rectSolid(nx + m, n.y + m, n.w - m*2, n.h - m*2)) n.x = nx;
    if (!rectSolid(n.x + m, ny + m, n.w - m*2, n.h - m*2)) n.y = ny;
    n.dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
  });
}

function startPuzzleMinigame() {
  puzzle.active       = true;
  puzzle.phase        = 0;
  puzzle.selected     = 0;
  puzzle.answered     = false;
  puzzle.cluesFound   = 0;
  puzzle.cluesSel     = 0;
  puzzle.flashTimer   = 0;
  game.state          = 'MINIGAME_PUZZLE';
}

function updatePuzzle() {
  if (!puzzle.active) return;

  if (justPressed['KeyZ']) {
    if (puzzle.phase < 2) {
      // Location puzzle
      if (!puzzle.answered) {
        puzzle.answered      = true;
        puzzle.answerCorrect = (puzzle.selected === PZ_DATA[puzzle.phase].correct);
        puzzle.flashTimer    = 80;
        AU.sfx(puzzle.answerCorrect ? 'confirm' : 'cancel');
      } else {
        // Advance phase
        AU.sfx('confirm');
        puzzle.phase++;
        puzzle.answered   = false;
        puzzle.selected   = 0;
        puzzle.flashTimer = 0;
        if (puzzle.phase === 2) puzzle.cluesSel = 0;
      }
    } else if (puzzle.phase === 2) {
      // Anomaly puzzle
      if (puzzle.cluesFound < ANOMALY_CLUES.length) {
        const idx = puzzle.cluesSel;
        if (idx < ANOMALY_CLUES.length) {
          puzzle.cluesFound = Math.max(puzzle.cluesFound, idx + 1);
          AU.sfx(puzzle.cluesFound >= ANOMALY_CLUES.length ? 'success' : 'confirm');
          if (puzzle.cluesFound >= ANOMALY_CLUES.length) {
            puzzle.flashTimer = 100;
          }
        }
      } else {
        // Done — advance to dock
        puzzle.active = false;
        game.state    = 'EXPLORE';
        setObjective('Get to the East Dock.');
        startDialogue([
          {speaker:'BECK', col:P.TEL, text:'The coordinates in that photo match the East Dock. 11 PM tonight.'},
          {speaker:'BECK', col:P.TEL, text:"Someone is using Pattern Lock to send instructions. It's a dead drop."},
          {choices:[
            {text:'Call the police first.',     pick:['first','police'],     jump:'police_call'},
            {text:'Go to the dock right now.',  pick:['first','dock_first'], jump:'go_dock'},
          ]},
          {label:'police_call',
           speaker:'DISPATCH', col:P.LGRY, text:'"Denver PD non-emergency."'},
          {speaker:'BECK', col:P.TEL, text:'There\'s an illegal weapons shipment at the East Dock tonight. I decoded hidden messages—'},
          {speaker:'DISPATCH', col:P.LGRY, text:'"How old are you, hon?"'},
          {speaker:'BECK', col:P.TEL, text:'That is NOT relevant—'},
          {speaker:'DISPATCH', col:P.LGRY, text:'"Is this for a school project?"'},
          {speaker:'', text:'They hang up.'},
          {speaker:'BECK', col:P.TEL, text:'Fine. I\'ll prove it myself.'},{jump:'go_dock'},
          {label:'go_dock',
           speaker:'', text:"Beck puts on dark clothes. Leaves a note: 'Went for a ride. Back by midnight.'"},
          {speaker:'', text:'The East Dock is 20 minutes by bike. It is 10:22 PM.'},
          {speaker:'', text:'She goes alone.'},
        ], () => transitionToScene('dock'));
      }
    }
  }

  if (puzzle.phase < 2 && !puzzle.answered) {
    if (justPressed['ArrowUp'])   puzzle.selected = Math.max(0, puzzle.selected-1);
    if (justPressed['ArrowDown'])  puzzle.selected = Math.min(3, puzzle.selected+1);
  } else if (puzzle.phase === 2 && puzzle.cluesFound < ANOMALY_CLUES.length) {
    if (justPressed['ArrowUp'])   puzzle.cluesSel = Math.max(0, puzzle.cluesSel-1);
    if (justPressed['ArrowDown'])  puzzle.cluesSel = Math.min(ANOMALY_CLUES.length-1, puzzle.cluesSel+1);
  }

  if (puzzle.flashTimer > 0) puzzle.flashTimer--;
}

    if (puzzle.answered) {
      const note = puzzle.answerCorrect

      drawWrappedText(note, bx+10, by+193, bw-20,

    } else {
      drawText('[↑↓] SELECT   [Z] CONFIRM', bx+8, by+bh-10, '#668899', 7);

  } else {
    // Anomaly puzzle
    drawText('PUZZLE #11 — SOMETHING IS WRONG', bx+8, by+27, P.YEL, 7);

    const photoLines = [

      const sel     = isClue && clueIdx === puzzle.cluesSel;

  const alpha = Math.min(1, intro.timer / 50);
  ctx.globalAlpha = alpha;

  px(0, GH/2-26, GW, 52, '#080818');
  px(0, GH/2-26, GW, 1, P.TEL);
  px(0, GH/2+26, GW, 1, P.TEL);

  ctx.save();
  ctx.textAlign = 'center';
  ctx.fillStyle = '#8899AA';
  ctx.font = '6px monospace';
  ctx.fillText('C H A P T E R   O N E', GW/2, GH/2-10);
  ctx.fillStyle = P.WHT;
  ctx.font = '9px monospace';
  ctx.fillText('The Pattern', GW/2, GH/2+9);
  ctx.restore();

  ctx.globalAlpha = 1;

  if (intro.timer > 140 && Math.floor(game.frame/28)%2===0) {
    ctx.save();
    ctx.textAlign = 'center';
    ctx.fillStyle = '#666';
    ctx.font = '6px monospace';
    ctx.fillText('[Z] BEGIN', GW/2, GH-12);
    ctx.restore();
  }
}

// ============================================================
// TITLE SCREEN
// ============================================================
const titleMenu = { idx: 0, confirmNewGame: false };

function startNewGame() {
  restartGame();
  game.state = 'INTRO';
}

function updateTitle() {
  const save = loadSave();

  if (!save) {
    if (justPressed['KeyZ'] || justPressed['KeyX'] || justPressed['Space']) { AU.sfx('confirm'); startNewGame(); }
    return;
  }

  if (titleMenu.confirmNewGame) {
    if (justPressed['KeyZ']) { AU.sfx('confirm'); clearSave(); startNewGame(); }
    if (justPressed['KeyX']) { AU.sfx('cancel'); titleMenu.confirmNewGame = false; }
    return;
  }

  if (justPressed['ArrowUp'])   titleMenu.idx = 0;
  if (justPressed['ArrowDown']) titleMenu.idx = 1;
  if (justPressed['KeyZ']) {
    AU.sfx('confirm');
    if (titleMenu.idx === 0) continueGame(save);
    else titleMenu.confirmNewGame = true;
  }
}

// Night skyline silhouette + a hand-authored 24x40 "box art" Beck, drawn
// once above the title box (y 0..48) — not the 14x28 in-game sprite
// stretched. fillRect only, per pillar 2.
const SKYLINE = [
  {x:0,   w:18, h:14}, {x:18,  w:12, h:26}, {x:30,  w:20, h:10},
  {x:50,  w:14, h:22}, {x:64,  w:10, h:34}, {x:74,  w:16, h:16},
  {x:166, w:16, h:16}, {x:182, w:10, h:34}, {x:192, w:14, h:22},
  {x:206, w:20, h:10}, {x:226, w:12, h:26}, {x:238, w:18, h:14},
];
const SKY_BASE = 48;

function drawTitleSkyline() {
  SKYLINE.forEach(b => {
    const y = SKY_BASE - b.h;
    px(b.x, y, b.w, b.h, '#0A0A1C');
    for (let wy = y+3; wy < SKY_BASE-3; wy += 5) {
      for (let wx = b.x+2; wx < b.x+b.w-2; wx += 5) {
        if ((wx+wy) % 11 < 3) px(wx, wy, 2, 2, '#3A3A18');
      }
    }
  });
  px(0, SKY_BASE, GW, 1, '#050510');
}

function drawBeckTitle(sx, sy) {
  const {HA,HB,HC,SK,EY,EW,MC,HO,HS,JN,JD,SH} = BECK_COL;
  function r(x,y,w,h,c) { ctx.fillStyle=c; ctx.fillRect(sx+x,sy+y,w,h); }

  r(4, 0,16, 3,HA); r(6, 2,12, 2,HB);        // hair crown
  r(0, 3, 5,16,HA); r(19,3, 5,16,HA);         // hair curtains
  r(5, 3,14,12,SK);                            // face
  r(5, 5,14, 1,HA);                            // hairline
  r(5, 9, 4, 2,HC); r(15, 9, 4, 2,HC);        // eyebrows
  r(5,11, 5, 3,EW); r(14,11, 5, 3,EW);        // eye whites
  r(7,12, 2, 2,EY); r(16,12, 2, 2,EY);        // irises
  r(9,17, 6, 2,MC);                            // mouth
  r(8,19, 8, 3,SK);                            // neck
  r(3,22,18,11,HO); r(10,22, 4,11,HS);        // hoodie + zip
  r(0,22, 4,12,HO); r(20,22, 4,12,HO);        // arms
  r(0,34, 4, 3,SK); r(20,34, 4, 3,SK);        // hands
  r(5,33,14, 4,JN); r(10,33, 4, 4,JD);        // jeans waist
  r(5,37, 6, 3,JN); r(13,37, 6, 3,JN);        // legs
  r(4,39, 8, 1,SH); r(12,39, 8, 1,SH);        // shoes
}

function drawTitle() {
  ctx.fillStyle = '#000000';
  ctx.fillRect(0, 0, GW, GH);

  // Stars
  const stars = [[20,15],[80,8],[140,20],[200,12],[240,30],
                  [40,50],[160,45],[220,55],[100,60],[30,80]];
  stars.forEach(([sx,sy]) => {
    const b = (Math.floor(game.frame/30) + Math.floor(sx/40)) % 2;
    px(sx, sy, 1, 1, b ? P.WHT : P.GRY);
  });

  drawTitleSkyline();
  drawBeckTitle(116, 8);

  // Title box
  px(20, 60, GW-40, 70, '#08081C');
  px(20, 60, GW-40, 2, P.TEL);
  px(20, 130, GW-40, 2, P.TEL);
  px(20, 60, 2, 70, P.TEL);
  px(GW-22, 60, 2, 70, P.TEL);

  drawText('BECK  HAWTHORNE', 38, 82, P.WHT, 8);
  drawText('ORIGIN', 92, 98, P.TEL, 8);
  px(38, 104, GW-76, 1, P.TEL);
  drawText('PROJECT  ARGUS', 52, 116, P.YEL, 6);
  drawText('CHAPTER ONE:  PATTERN', 54, 126, P.GRY, 5);

  const save = loadSave();
  let hintY = 185;

  if (!save) {
    if (Math.floor(game.frame/25)%2===0)
      drawText('PRESS  Z  TO  START', 68, 160, P.WHT, 6);
  } else if (titleMenu.confirmNewGame) {
    drawWrappedText('Start over? Progress will be lost.', 26, 154, GW-52, P.LRED, 6);
    drawText('[Z] YES     [X] CANCEL', 62, 174, P.YEL, 6);
    hintY = 195;
  } else {
    const opts = ['CONTINUE', 'NEW GAME'];
    opts.forEach((label, i) => {
      const sel = i === titleMenu.idx;
      drawText((sel ? '▶ ' : '  ') + label, 86, 154 + i*14, sel ? P.WHT : P.GRY, 7);
    });
    if (Math.floor(game.frame/25)%2===0)
      drawText('[UP/DOWN] SELECT   [Z] CONFIRM', 44, 182, P.DGRY, 5);
    hintY = 195;
  }

  drawText('ARROW KEYS: MOVE     Z: INTERACT', 30, hintY, P.DGRY, 5);
  drawText('X: SKIP     EXPLORE EVERYTHING', 34, hintY+10, P.DGRY, 5);

  // M6-T4: release version string
  drawText('v1.0 — CHAPTER ONE', 80, 216, P.GRY, 5);

  // NES copyright style
  drawText('© BECK HAWTHORNE: ORIGIN  2026', 30, 226, '#303030', 5);
}

// ============================================================
// ENDING SCREEN
// ============================================================
// M5-T2: the ending is a 3-stage ceremony — narrative (ENDING) ->
// mission-report card (ENDING_REPORT) -> Chapter Two teaser
// (ENDING_TEASER) -> stepped fade back to TITLE with the save cleared.
const PSYCH_PROFILE = { pushback:'DIRECT', maybe:'GUARDED', silent:'SILENT' };

function drawEnding() {
  ctx.fillStyle = '#000000';
  ctx.fillRect(0, 0, GW, GH);

  px(10, 10, GW-20, GH-20, '#080818');
  px(10, 10, GW-20, 2, P.YEL);
  px(10, GH-12, GW-20, 2, P.YEL);

  drawText('CHAPTER ONE COMPLETE', 36, 32, P.YEL, 6);
  px(20, 37, GW-40, 1, P.DGRY);

  const choice = game.choices['final'] || 'silent';
  const lines = {
    pushback:[
      '"One day blindly following',
      'orders gets someone killed."',
      '',
      "Kane doesn't answer.",
      'Beck picks up the card.',
    ],
    silent:[
      'Beck picks up the card.',
      'Says nothing.',
      '',
      'Sometimes silence is',
      'the loudest answer.',
    ],
    maybe:[
      '"I\'ll think about it."',
      '',
      'She calls three days later.',
      'At midnight.',
      'She tells herself it\'s',
      'just a phone call.',
    ],
  }[choice];

  lines.forEach((l, i) => {
    drawText(l, 30, 56 + i * 13, P.WHT, 6);
  });

  px(20, 138, GW-40, 1, P.DGRY);
  drawText('Three days later:', 30, 152, P.GRY, 5);
  drawText('She calls the number.', 30, 163, P.TEL, 6);
  drawText('Two days after that:', 30, 176, P.GRY, 5);
  drawText('Her grandfather says yes.', 30, 187, P.WHT, 6);

  px(20, 196, GW-40, 1, P.DGRY);

  // M5-T1: choice echo — if Beck deflected with Indy earlier, Indy isn't
  // fooled and texts her during the ending instead of Kane calling it out.
  if (game.choices.indy === 'deflect') {
    drawText('Her phone buzzes. INDY:', 30, 207, P.GRY, 5);
    drawText('"you\'re still a bad liar. call me."', 30, 217, P.PNK, 5);
  }

  if (Math.floor(game.frame/30)%2===0)
    drawText('[Z] CONTINUE', 92, 226, P.YEL, 5);

  if (justPressed['KeyZ'])
    transition.start('fade', () => { game.state = 'ENDING_REPORT'; });
}

function drawEndingReport() {
  ctx.fillStyle = '#000000';
  ctx.fillRect(0, 0, GW, GH);

  px(10, 10, GW-20, GH-20, '#080818');
  px(10, 10, GW-20, 2, P.TEL);
  px(10, GH-12, GW-20, 2, P.TEL);

  drawText('MISSION REPORT', 58, 32, P.TEL, 6);
  px(20, 37, GW-40, 1, P.DGRY);

  const ev = game.evidenceFound.length;
  drawText('EVIDENCE COLLECTED', 30, 62, P.LGRY, 5);
  drawText(`${ev}/4`, 30, 76, ev >= 4 ? P.YEL : P.WHT, 8);

  drawText('HEARTS REMAINING', 30, 102, P.LGRY, 5);
  for (let i = 0; i < pl.maxHearts; i++) {
    const hx = 30 + i * 12, hy = 110;
    px(hx, hy, 8, 7, i < pl.hearts ? P.RED : P.DGRY);
    px(hx+2, hy-1, 2, 1, i < pl.hearts ? P.LRED : '#404040');
    px(hx+5, hy-1, 2, 1, i < pl.hearts ? P.LRED : '#404040');
  }

  drawText('PSYCH PROFILE', 30, 140, P.LGRY, 5);
  const finalChoice = game.choices['final'] || 'silent';
  const profile = PSYCH_PROFILE[finalChoice] || 'SILENT';
  drawText(`[ ${profile} ]`, 30, 154, P.YEL, 7);

  px(20, 174, GW-40, 1, P.DGRY);
  drawText('Chapter One: complete.', 30, 190, P.WHT, 6);

  if (Math.floor(game.frame/30)%2===0)
    drawText('[Z] CONTINUE', 92, 226, P.YEL, 5);

  if (justPressed['KeyZ'])
    transition.start('fade', () => { game.state = 'ENDING_TEASER'; });
}

function drawEndingTeaser() {
  ctx.fillStyle = '#000000';
  ctx.fillRect(0, 0, GW, GH);

  ctx.save();
  ctx.textAlign = 'center';
  ctx.fillStyle = P.YEL;
  ctx.font = '9px monospace';
  ctx.fillText('CHAPTER TWO: TEAM', GW/2, GH/2 - 6);
  ctx.fillStyle = P.LGRY;
  ctx.font = '6px monospace';
  ctx.fillText('COMING SOON', GW/2, GH/2 + 10);
  ctx.restore();

  if (Math.floor(game.frame/30)%2===0)
    drawText('[Z] RETURN TO TITLE', 66, GH-16, P.GRY, 5);

  if (justPressed['KeyZ']) {
    clearSave();
    transition.start('fade', () => restartGame());
  }
}

// ============================================================
// SCENE LOADING
// ============================================================
function loadScene(mapId, heal = true) {
  game.mapId          = mapId;
  game.dockChaseActive = false;
  game.state          = 'EXPLORE';
  game.frame          = 0;
  if (mapId === 'dock') resetDockGuards();

  const map = MAPS[mapId];
  pl.x     = map.playerSpawn.x;
  pl.y     = map.playerSpawn.y;
  if (heal && pl.hearts < pl.maxHearts) { AU.sfx('heart'); heartRestoreTimer = 40; }
  if (heal) pl.hearts = Math.min(pl.maxHearts, pl.hearts + 1); // restore 1 heart on scene change
  pl.invincible = 60;
  updateCam();
  saveGame();
  AU.music(MUSIC_FOR_MAP[mapId] || mapId);
}

function continueGame(save) {
  game.evidenceFound = Array.isArray(save.evidenceFound) ? save.evidenceFound.slice() : [];
  game.choices        = (save.choices && typeof save.choices === 'object') ? save.choices : {};
  pl.hearts = (typeof save.hearts === 'number')
    ? Math.max(0, Math.min(pl.maxHearts, save.hearts))
    : pl.maxHearts;
  loadScene(save.mapId, false);
}

function restartGame() {
  Object.assign(game, {
    state:'TITLE', frame:0, mapId:'bedroom',
    evidenceFound:[], choices:{}, dockChaseActive:false, pausedFrom:null,
    shadowTaught:false,
  });
  setObjective('Solve the Pattern Lock puzzle on your computer.', true);
  intro.slide = 0; intro.timer = 0;
  Object.assign(pl, {x:0,y:0,dir:'down',frame:0,moving:false,hearts:3,invincible:0});
  Object.assign(titleMenu, {idx:0, confirmNewGame:false});
  resetDockGuards();
  game.frame = 0;
  AU.music('title');
}

// Patrol guards return to their first waypoint, active and CALM; the
// smuggler (guard #4) stays hidden until the M3-T4 dock finale.
function resetDockGuards() {
  MAPS['dock'].npcs.forEach(g => {
    if (!g.guard) return;
    if (g.patrol) {
      g.x = g.waypoints[0].x; g.y = g.waypoints[0].y;
      g.wpIdx = 1; g.active = true;
    } else {
      g.x = 15*TW; g.y = 12*TH; g.active = false;
    }
    g.state = 'CALM'; g.susTimer = 0; g.sightTimer = 0; g.cooldown = 0;
  });
}

// ============================================================
// MAIN GAME LOOP
// ============================================================
function loop() {
  game.frame++;
  transition.update();
  AU.updateMusic();
  if (justPressed['KeyM']) AU.toggleMute();

  // --- UPDATE ---
  // Input is ignored entirely while a transition is playing.
  if (!transition.active) {
    if (justPressed['Enter']) {
      if (game.state === 'EXPLORE') openPause();
      else if (game.state === 'PAUSED') closePause();
    }
    switch (game.state) {
    case 'TITLE':
      updateTitle();
      break;
    case 'INTRO':
      updateIntro();
      break;
    case 'CHAPTER_CARD':
      updateChapterCard();
      break;
    case 'EXPLORE':
      updatePlayer();
      updateGuards();
      updateWanderers();
      updateShadowTeach();
      checkInteract();
      checkCafeArrow();
      updateCam();
      break;
    case 'DIALOGUE':
      updateDialogue();
      break;
    case 'MINIGAME_PUZZLE':
      updatePuzzle();
      break;
    case 'PAUSED':
      updatePause();
      break;
    case 'ENDING':
    case 'ENDING_REPORT':
    case 'ENDING_TEASER':
      break;
    }
  }
  updateDust();

  // --- DRAW ---
  ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0);
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, GW, GH);

  if (game.state === 'TITLE') {
    drawTitle();
  } else if (game.state === 'INTRO') {
    drawIntro();
  } else if (game.state === 'CHAPTER_CARD') {
    drawChapterCard();
  } else if (game.state === 'ENDING') {
    drawEnding();
  } else if (game.state === 'ENDING_REPORT') {
    drawEndingReport();
  } else if (game.state === 'ENDING_TEASER') {
    drawEndingTeaser();
  } else {
    // 4-frame camera shake on damage: offset cam for this draw only,
    // then restore so collision/updateCam math next frame is unaffected.
    let shakeX = 0, shakeY = 0;
    if (camShakeFrames > 0) {
      shakeX = (camShakeFrames % 2 === 0) ? 2 : -2;
      shakeY = (camShakeFrames % 2 === 0) ? -2 : 2;
      cam.x += shakeX; cam.y += shakeY;
      camShakeFrames--;
    }

    drawMap();

    // Draw NPCs
    const map = MAPS[game.mapId];
    map.npcs.forEach(drawNPC);

    // Footstep dust (behind Beck)
    drawDust();

    // Draw player
    drawPlayer();

    if (shakeX || shakeY) { cam.x -= shakeX; cam.y -= shakeY; }

    // Dialogue box
    drawDialogueBox();

    // Puzzle overlay
    if (game.state === 'MINIGAME_PUZZLE') drawPuzzle();

    drawHUD();

    if (game.state === 'PAUSED') drawPause();
  }

  drawObjectiveBanner();
  drawToast();
  drawMuteGlyph();
  transition.draw();

  // Clear justPressed AFTER drawing so title/ending screens can read it
  for (const k in justPressed) delete justPressed[k];

  requestAnimationFrame(loop);
}

// ============================================================
// INIT
// ============================================================
const _initSave = loadSave();
if (_initSave && typeof _initSave.muted === 'boolean') AU.muted = _initSave.muted;
if (_initSave && TEXT_SPEED_ORDER.includes(_initSave.textSpeed)) game.textSpeed = _initSave.textSpeed;
restartGame();
game.state = 'TITLE';
requestAnimationFrame(loop);
</script>
